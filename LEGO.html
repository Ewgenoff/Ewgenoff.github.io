<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог конструкторов LEGO</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --status-bg: #1e293b;
            --theme-bg: #e0f2fe;
            --theme-text: #0369a1;
            --year-bg: #f1f5f9;
            --year-text: #475569;
            --pieces-bg: #fef3c7;
            --pieces-text: #92400e;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            background: #ffffff;
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .search-box {
            flex: 1 1 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.6;
        }

        .filter-select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            cursor: pointer;
        }

        .stats-bar {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .card-image-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .card-image-wrap img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .card:hover .card-image-wrap img {
            transform: scale(1.05);
        }

        /* Плашка статуса (Столбец H) */
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Номер набора (Столбец A) */
        .set-number {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        /* Название (Столбец C) */
        .set-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        /* Плашки под номером */
        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
        }

        /* Серия (Столбец F) */
        .badge-theme {
            background-color: var(--theme-bg);
            color: var(--theme-text);
        }

        /* Год (Столбец E) */
        .badge-year {
            background-color: var(--year-bg);
            color: var(--year-text);
        }

        /* Детали (Столбец D) с иконкой 🧩 */
        .badge-pieces {
            background-color: var(--pieces-bg);
            color: var(--pieces-text);
        }

        /* Окно детализации */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-img-container {
            width: 100%;
            height: 280px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-content {
            padding: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-card {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .info-card .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 0;
            font-size: 18px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧩 Каталог наборов LEGO</h1>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по номеру или названию..." oninput="filterData()">
        </div>
        <select id="themeFilter" class="filter-select" onchange="filterData()">
            <option value="">Все серии</option>
        </select>
        <select id="statusFilter" class="filter-select" onchange="filterData()">
            <option value="">Все статусы</option>
        </select>
    </div>

    <div class="stats-bar">
        <span id="countDisplay">Загрузка данных...</span>
    </div>

    <div id="grid" class="grid">
        <div class="loading-spinner">⏳ Загрузка каталога наборов...</div>
    </div>
</div>

<!-- Модальное окно описания -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
        <div class="modal-img-container">
            <img id="modalImg" src="" alt="">
        </div>
        <div class="modal-content">
            <div id="modalSetNum" class="set-number"></div>
            <h2 id="modalTitle" class="modal-title"></h2>
            
            <div class="modal-info-grid">
                <div class="info-card">
                    <div class="label">Серия набора</div>
                    <div id="modalTheme" class="value">—</div>
                </div>
                <div class="info-card">
                    <div class="label">Количество деталей</div>
                    <div id="modalPieces" class="value">—</div>
                </div>
                <div class="info-card">
                    <div class="label">Год выпуска</div>
                    <div id="modalYear" class="value">—</div>
                </div>
                <div class="info-card">
                    <div class="label">Статус</div>
                    <div id="modalStatus" class="value">—</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPpn75qFGUsV-gVTl3MzZ9SDzYK88acKUfzIyphP15jdfDzqVEku1zQaOWPccc5z6BCJf1-EPMcraO/pub?gid=475660989&single=true&output=csv';

    // Индексы столбцов таблицы Google Sheets
    const COL_SET_NUM = 0;  // A: Номер набора
    const COL_NAME    = 2;  // C: Название конструктора
    const COL_PIECES  = 3;  // D: Кол-во деталей
    const COL_YEAR    = 4;  // E: Год выпуска
    const COL_THEME   = 5;  // F: Серия
    const COL_STATUS  = 7;  // H: Статус

    let rawSetsData = [];

    // Прямой метод загрузки CDN изображений Rebrickable по номеру набора без CORS блокировок
    function getImageUrl(setNum) {
        if (!setNum) return 'https://via.placeholder.com/300x220?text=No+Image';
        let cleanNum = setNum.toString().trim();
        if (!cleanNum.includes('-')) {
            cleanNum += '-1';
        }
        return `https://cdn.rebrickable.com/media/sets/${cleanNum}.jpg`;
    }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            let row = [];
            let inQuotes = false;
            let currentStr = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentStr.trim().replace(/^"|"$/g, ''));
                    currentStr = '';
                } else {
                    currentStr += char;
                }
            }
            row.push(currentStr.trim().replace(/^"|"$/g, ''));
            result.push(row);
        }
        return result;
    }

    async function loadData() {
        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            const parsed = parseCSV(csvText);

            rawSetsData = parsed.slice(1).filter(row => row.length > 2 && row[COL_SET_NUM]);

            populateFilters(rawSetsData);
            renderCards(rawSetsData);
        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            document.getElementById('grid').innerHTML = `
                <div class="loading-spinner" style="color: #ef4444;">
                    ❌ Ошибка загрузки данных таблицы.
                </div>
            `;
        }
    }

    function populateFilters(data) {
        const themes = new Set();
        const statuses = new Set();

        data.forEach(row => {
            if (row[COL_THEME]) themes.add(row[COL_THEME]);
            if (row[COL_STATUS]) statuses.add(row[COL_STATUS]);
        });

        const themeSelect = document.getElementById('themeFilter');
        Array.from(themes).sort().forEach(theme => {
            const opt = document.createElement('option');
            opt.value = theme;
            opt.textContent = theme;
            themeSelect.appendChild(opt);
        });

        const statusSelect = document.getElementById('statusFilter');
        Array.from(statuses).sort().forEach(status => {
            const opt = document.createElement('option');
            opt.value = status;
            opt.textContent = status;
            statusSelect.appendChild(opt);
        });
    }

    function renderCards(data) {
        const grid = document.getElementById('grid');
        const countDisplay = document.getElementById('countDisplay');
        
        countDisplay.textContent = `Найдено наборов: ${data.length}`;

        if (data.length === 0) {
            grid.innerHTML = '<div class="loading-spinner">Наборы не найдены</div>';
            return;
        }

        grid.innerHTML = data.map((row, index) => {
            const setNum = row[COL_SET_NUM] || '—';
            const name   = row[COL_NAME]    || 'Без названия';
            const pieces = row[COL_PIECES]  || '—';
            const year   = row[COL_YEAR]    || '—';
            const theme  = row[COL_THEME]   || '—';
            const status = row[COL_STATUS]  || 'Не указан';

            const primaryImg = getImageUrl(setNum);
            const fallbackImg = `https://cdn.rebrickable.com/media/sets/${setNum.toString().trim()}.jpg`;

            return `
                <div class="card" onclick="openModal(${index})">
                    <div class="card-image-wrap">
                        <!-- Изображение с автозаменой и обработкой ошибок -->
                        <img src="${primaryImg}" 
                             alt="${name}" 
                             onerror="if (this.src !== '${fallbackImg}') { this.src='${fallbackImg}'; } else { this.onerror=null; this.src='https://via.placeholder.com/300x220?text=Нет+фото'; }" />
                        <!-- Плашка Статус (Столбец H) -->
                        <span class="status-badge">${status}</span>
                    </div>
                    <div class="card-body">
                        <!-- Номер набора (Столбец A) -->
                        <div class="set-number">№ ${setNum}</div>
                        <!-- Название конструктора (Столбец C) -->
                        <h3 class="set-title">${name}</h3>
                        
                        <!-- Плашки внизу под номером -->
                        <div class="badges-container">
                            <!-- Серия (Столбец F) -->
                            <span class="badge badge-theme">${theme}</span>
                            <!-- Год выпуска (Столбец E) -->
                            <span class="badge badge-year">${year}</span>
                            <!-- Кол-во деталей (Столбец D) со значком 🧩 -->
                            <span class="badge badge-pieces">🧩 ${pieces}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterData() {
        const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedTheme = document.getElementById('themeFilter').value;
        const selectedStatus = document.getElementById('statusFilter').value;

        const filtered = rawSetsData.filter(row => {
            const setNum = (row[COL_SET_NUM] || '').toLowerCase();
            const name   = (row[COL_NAME] || '').toLowerCase();
            const theme  = row[COL_THEME] || '';
            const status = row[COL_STATUS] || '';

            return (setNum.includes(searchVal) || name.includes(searchVal)) &&
                   (!selectedTheme || theme === selectedTheme) &&
                   (!selectedStatus || status === selectedStatus);
        });

        renderCards(filtered);
    }

    function openModal(index) {
        const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedTheme = document.getElementById('themeFilter').value;
        const selectedStatus = document.getElementById('statusFilter').value;

        const filteredData = rawSetsData.filter(row => {
            const setNum = (row[COL_SET_NUM] || '').toLowerCase();
            const name   = (row[COL_NAME] || '').toLowerCase();
            const theme  = row[COL_THEME] || '';
            const status = row[COL_STATUS] || '';

            return (setNum.includes(searchVal) || name.includes(searchVal)) &&
                   (!selectedTheme || theme === selectedTheme) &&
                   (!selectedStatus || status === selectedStatus);
        });

        const row = filteredData[index];
        if (!row) return;

        const setNum = row[COL_SET_NUM] || '—';
        const name   = row[COL_NAME]    || 'Без названия';
        const pieces = row[COL_PIECES]  || '—';
        const year   = row[COL_YEAR]    || '—';
        const theme  = row[COL_THEME]   || '—';
        const status = row[COL_STATUS]  || 'Не указан';

        const imgUrl = getImageUrl(setNum);

        document.getElementById('modalImg').src = imgUrl;
        document.getElementById('modalImg').onerror = function() {
            this.onerror = null;
            this.src = 'https://via.placeholder.com/400x300?text=Нет+фото';
        };
        document.getElementById('modalSetNum').textContent = `Артикул № ${setNum}`;
        document.getElementById('modalTitle').textContent = name;
        
        // В окне с описанием: Серия из столбца F, Кол-во деталей из D
        document.getElementById('modalTheme').textContent = theme;
        document.getElementById('modalPieces').textContent = `${pieces} деталей`;
        document.getElementById('modalYear').textContent = year;
        document.getElementById('modalStatus').textContent = status;

        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(event) {
        if (event.target === document.getElementById('modalOverlay')) {
            closeModalDirect();
        }
    }

    function closeModalDirect() {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    loadData();
</script>
</body>
</html>
