<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аптечка — Лекарства</title>
    <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=p0KyrwUl5Ko8UT9Nix2QJDqWab32N2_Gd3JnCuDQ4tw3VWDSOzccJn1EkiZNb2hDdwkjpdnw6jEMZl9IubrTmRKDK7XTPgVk10aYGcHsCeroX2F_nBtl8KBTNjvGkQ0qKU-g_ZSVOwdNwVA5B8NN1Vffz9aCUFrAKMQcEboHiDZOSSEBjOM5UG4xpTUlmRFNn6dctmA1wVX19OzxLuLVzMJd9RAxdYYmnmlUDItffF3J_0ea2fehEi63vs5whfEJfwYeRFhp6thJ2xrEeP9KHTgdtzX_hB-ZaCx_EgjeKAKfD0uVikdtCSwLfEG7t_DE45eiWRQ_gc5pfXcY9EsBsw" charset="UTF-8"></script><style>
        :root {
            /* Светлая тема (по умолчанию) */
            --bg-color: #F2F2F7;
            --gradient-tl: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.05) 0px, transparent 50%);
            --gradient-br: radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.04) 0px, transparent 50%);
            
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            
            --card-bg-glass: rgba(255, 255, 255, 0.75);
            --card-active-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.8);
            
            --color-default: #007AFF;
            --color-danger: #FF3B30;
            --color-danger-bg: rgba(255, 59, 48, 0.12);
            --color-danger-border: rgba(255, 59, 48, 0.35);
            --color-warning: #FF9500;
            --color-success: #34C759;

            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            --ios-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            
            --radius-card: 14px;
            --radius-control: 10px;
        }

        /* Тёмная тема */
        [data-theme="dark"] {
            --bg-color: #000000;
            --gradient-tl: radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.12) 0px, transparent 50%);
            --gradient-br: radial-gradient(at 100% 100%, rgba(255, 55, 95, 0.08) 0px, transparent 50%);
            
            --text-primary: #F2F2F7;
            --text-secondary: #98989D;
            
            --card-bg-glass: rgba(28, 28, 30, 0.75);
            --card-active-bg: rgba(44, 44, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            
            --color-danger-bg: rgba(255, 69, 58, 0.22);
            --color-danger-border: rgba(255, 69, 58, 0.45);

            --ios-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #000000;
                --gradient-tl: radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.12) 0px, transparent 50%);
                --gradient-br: radial-gradient(at 100% 100%, rgba(255, 55, 95, 0.08) 0px, transparent 50%);
                
                --text-primary: #F2F2F7;
                --text-secondary: #98989D;
                
                --card-bg-glass: rgba(28, 28, 30, 0.75);
                --card-active-bg: rgba(44, 44, 46, 0.85);
                --card-border: rgba(255, 255, 255, 0.12);

                --color-danger-bg: rgba(255, 69, 58, 0.22);
                --color-danger-border: rgba(255, 69, 58, 0.45);
                
                --ios-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--ios-font);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--gradient-tl), var(--gradient-br);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 20px 16px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Панель управления (Поиск + Сортировка) */
        .controls-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 38px;
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            font-size: 0.95rem;
            color: var(--text-primary);
            box-shadow: var(--ios-shadow);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--color-default);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            padding: 6px 12px;
            box-shadow: var(--ios-shadow);
        }

        .sort-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        .sort-select {
            background: transparent;
            border: none;
            color: var(--color-default);
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .sort-select option {
            background: var(--bg-color);
            color: var(--text-primary);
        }

        /* Список лекарств / Таблица */
        .med-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .med-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--ios-shadow);
            transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
        }

        /* Просроченное лекарство — красная подсветка */
        .med-card.expired {
            background: var(--color-danger-bg);
            border: 1px solid var(--color-danger-border);
        }

        .med-card.expired .med-name {
            color: var(--color-danger);
            font-weight: 600;
        }

        .med-card.expired .med-date {
            color: var(--color-danger);
            font-weight: 700;
        }

        .med-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            padding-right: 12px;
        }

        .med-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .med-details {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .med-status-badge {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        .med-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .badge {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .badge-expired {
            background: rgba(255, 59, 48, 0.2);
            color: var(--color-danger);
        }

        .badge-valid {
            background: rgba(52, 199, 89, 0.15);
            color: var(--color-success);
        }

        .loader {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .empty-msg {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            background: var(--card-bg-glass);
            border-radius: var(--radius-card);
            border: 1px solid var(--card-border);
        }

        /* Подвал */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 24px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка -->
        <div class="header">
            <h1>Аптечка</h1>
            <p id="stats-counter">Загрузка данных из Google Таблицы...</p>
        </div>

        <!-- Поиск и Сортировка -->
        <div class="controls-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск лекарства..." oninput="filterAndRender()">
            </div>
            
            <div class="sort-box">
                <span class="sort-label">Сортировка:</span>
                <select id="sortSelect" class="sort-select" onchange="filterAndRender()">
                    <option value="name">По название (А - Я)</option>
                    <option value="expiredFirst">Сначала просроченные</option>
                    <option value="validFirst">Сначала годные</option>
                    <option value="dateAsc">По сроку (ранние сначала)</option>
                    <option value="dateDesc">По сроку (поздние сначала)</option>
                </select>
            </div>
        </div>

        <!-- Таблица / Список лекарств -->
        <div id="medList" class="med-list">
            <div class="loader">Получение списка лекарств...</div>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        Версия 1.0 (by Ewgenoff 31.07.2026)
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROsTHKb21QaPxXxGW_xWgQJ5kKz3BKCfIsVHX6JSH4QOoqnhHDAxcuAbOtQYUiFKrKiODjlQSnLnUi/pub?gid=2071309898&single=true&output=csv";

        let medicines = [];

        // Простая функция парсинга CSV с учетом кавычек
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            
            for (let line of lines) {
                if (!line.trim()) continue;
                let cells = [];
                let insideQuotes = false;
                let currentCell = '';
                
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"' || char === "'") {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        cells.push(currentCell.trim().replace(/^["']|["']$/g, ''));
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                cells.push(currentCell.trim().replace(/^["']|["']$/g, ''));
                result.push(cells);
            }
            return result;
        }

        // Парсинг даты из строки (поддерживает DD.MM.YYYY, YYYY-MM-DD, MM.YYYY)
        function parseExpiryDate(dateStr) {
            if (!dateStr) return null;
            let str = dateStr.trim();
            
            // Формат DD.MM.YYYY или D.M.YYYY
            let parts = str.split('.');
            if (parts.length === 3) {
                let day = parseInt(parts[0], 10);
                let month = parseInt(parts[1], 10) - 1;
                let year = parseInt(parts[2], 10);
                if (year < 100) year += 2000;
                return new Date(year, month, day, 23, 59, 59);
            }

            // Формат MM.YYYY
            if (parts.length === 2) {
                let month = parseInt(parts[0], 10) - 1;
                let year = parseInt(parts[1], 10);
                if (year < 100) year += 2000;
                // За конец месяца берем последний день
                return new Date(year, month + 1, 0, 23, 59, 59);
            }

            // Попытка стандартного парсинга
            let parsed = new Date(str);
            if (!isNaN(parsed.getTime())) return parsed;

            return null;
        }

        // Загрузка данных
        async function fetchMedications() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Ошибка загрузки CSV");
                
                const csvData = await response.text();
                const rows = parseCSV(csvData);

                medicines = [];
                const now = new Date();

                // Пропускаем заголовок если первая строчка содержит слова "название" или "наименование"
                let startIdx = 0;
                if (rows.length > 0 && rows[0][0] && (rows[0][0].toLowerCase().includes('назван') || rows[0][0].toLowerCase().includes('лекарст'))) {
                    startIdx = 1;
                }

                for (let i = startIdx; i < rows.length; i++) {
                    const row = rows[i];
                    const name = row[0] ? row[0].trim() : '';
                    if (!name) continue;

                    // Столбец B (индекс 1) — при наличии дополнительной информации, Столбец C (индекс 2) — Срок хранения
                    const note = row[1] ? row[1].trim() : '';
                    const expiryRaw = row[2] ? row[2].trim() : '';

                    const expiryDate = parseExpiryDate(expiryRaw);
                    const isExpired = expiryDate ? (expiryDate < now) : false;

                    medicines.push({
                        name: name,
                        note: note,
                        expiryRaw: expiryRaw,
                        expiryDate: expiryDate,
                        isExpired: isExpired
                    });
                }

                filterAndRender();
            } catch (err) {
                console.error(err);
                document.getElementById('medList').innerHTML = `<div class="empty-msg">Не удалось загрузить данные из таблицы. Проверьте подключение.</div>`;
            }
        }

        // Фильтрация и отображение
        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = medicines.filter(m => m.name.toLowerCase().includes(query) || m.note.toLowerCase().includes(query));

            // Сортировка
            filtered.sort((a, b) => {
                if (sortVal === 'name') {
                    return a.name.localeCompare(b.name, 'ru');
                } else if (sortVal === 'expiredFirst') {
                    return (b.isExpired === a.isExpired) ? a.name.localeCompare(b.name, 'ru') : (b.isExpired ? 1 : -1);
                } else if (sortVal === 'validFirst') {
                    return (a.isExpired === b.isExpired) ? a.name.localeCompare(b.name, 'ru') : (a.isExpired ? 1 : -1);
                } else if (sortVal === 'dateAsc') {
                    if (!a.expiryDate) return 1;
                    if (!b.expiryDate) return -1;
                    return a.expiryDate - b.expiryDate;
                } else if (sortVal === 'dateDesc') {
                    if (!a.expiryDate) return 1;
                    if (!b.expiryDate) return -1;
                    return b.expiryDate - a.expiryDate;
                }
                return 0;
            });

            // Статистика
            const total = medicines.length;
            const expiredCount = medicines.filter(m => m.isExpired).length;
            document.getElementById('stats-counter').textContent = `Всего: ${total} | Просрочено: ${expiredCount}`;

            // Рендер элементов
            const container = document.getElementById('medList');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-msg">Лекарства не найдены</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="med-card ${item.isExpired ? 'expired' : ''}">
                    <div class="med-info">
                        <div class="med-name">${escapeHtml(item.name)}</div>
                        ${item.note ? `<div class="med-details">${escapeHtml(item.note)}</div>` : ''}
                    </div>
                    <div class="med-status-badge">
                        <div class="med-date">${item.expiryRaw ? escapeHtml(item.expiryRaw) : '—'}</div>
                        ${item.isExpired 
                            ? `<span class="badge badge-expired">Просрочено</span>` 
                            : `<span class="badge badge-valid">Годен</span>`}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Запуск при загрузке
        fetchMedications();
    </script>
</body>
</html>
