<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аптечка — Лекарства</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --gradient-tl: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.05) 0px, transparent 50%);
            --gradient-br: radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.04) 0px, transparent 50%);
            
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            
            --card-bg-glass: rgba(255, 255, 255, 0.75);
            --card-active-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.8);
            
            --color-default: #007AFF;
            --color-danger: #FF3B30;
            --color-danger-bg: rgba(255, 59, 48, 0.12);
            --color-danger-border: rgba(255, 59, 48, 0.35);
            --color-warning: #FF9500;
            --color-warning-bg: rgba(255, 149, 0, 0.15);
            --color-success: #34C759;
            --color-gray-card: rgba(142, 142, 147, 0.25);

            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            --ios-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            
            --radius-card: 14px;
            --radius-control: 10px;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --gradient-tl: radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.12) 0px, transparent 50%);
            --gradient-br: radial-gradient(at 100% 100%, rgba(255, 55, 95, 0.08) 0px, transparent 50%);
            
            --text-primary: #F2F2F7;
            --text-secondary: #98989D;
            
            --card-bg-glass: rgba(28, 28, 30, 0.75);
            --card-active-bg: rgba(44, 44, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            
            --color-danger-bg: rgba(255, 69, 58, 0.22);
            --color-danger-border: rgba(255, 69, 58, 0.45);
            --color-gray-card: rgba(100, 100, 104, 0.35);

            --ios-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-color: #000000;
                --gradient-tl: radial-gradient(at 0% 0%, rgba(10, 132, 255, 0.12) 0px, transparent 50%);
                --gradient-br: radial-gradient(at 100% 100%, rgba(255, 55, 95, 0.08) 0px, transparent 50%);
                
                --text-primary: #F2F2F7;
                --text-secondary: #98989D;
                
                --card-bg-glass: rgba(28, 28, 30, 0.75);
                --card-active-bg: rgba(44, 44, 46, 0.85);
                --card-border: rgba(255, 255, 255, 0.12);

                --color-danger-bg: rgba(255, 69, 58, 0.22);
                --color-danger-border: rgba(255, 69, 58, 0.45);
                --color-gray-card: rgba(100, 100, 104, 0.35);

                --ios-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--ios-font);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--gradient-tl), var(--gradient-br);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 20px 16px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка и Статистика */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .stat-badge {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--ios-shadow);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .text-success { color: var(--color-success); }
        .text-danger { color: var(--color-danger); }
        .text-warning { color: var(--color-warning); }

        /* Элементы управления */
        .controls-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 38px;
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            font-size: 0.95rem;
            color: var(--text-primary);
            box-shadow: var(--ios-shadow);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--color-default);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .sort-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            padding: 6px 12px;
            box-shadow: var(--ios-shadow);
        }

        .sort-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        .sort-select {
            background: transparent;
            border: none;
            color: var(--color-default);
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .sort-select option {
            background: var(--bg-color);
            color: var(--text-primary);
        }

        /* Список лекарств */
        .med-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .med-card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--ios-shadow);
            transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .med-card:active {
            transform: scale(0.98);
        }

        /* Серые карточки (Столбец B = "нет") */
        .med-card.grayed {
            background: var(--color-gray-card);
            opacity: 0.7;
        }

        /* Просрочено */
        .med-card.expired {
            background: var(--color-danger-bg);
            border: 1px solid var(--color-danger-border);
        }

        .med-card.expired .med-name {
            color: var(--color-danger);
        }

        .med-card.expired .med-date {
            color: var(--color-danger);
            font-weight: 700;
        }

        /* Скоро истекает */
        .med-card.expiring-soon:not(.expired) {
            border: 1px solid var(--color-warning);
        }

        .med-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            padding-right: 12px;
        }

        .med-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .med-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            margin-top: 2px;
        }

        .med-details {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .med-status-badge {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .med-date {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .badge {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .badge-expired {
            background: rgba(255, 59, 48, 0.2);
            color: var(--color-danger);
        }

        .badge-warning {
            background: var(--color-warning-bg);
            color: var(--color-warning);
        }

        .badge-valid {
            background: rgba(52, 199, 89, 0.15);
            color: var(--color-success);
        }

        .loader, .empty-msg {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            background: var(--card-bg-glass);
            border-radius: var(--radius-card);
            border: 1px solid var(--card-border);
        }

        /* iOS Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ios-modal {
            background: var(--card-bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .ios-modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-group {
            font-size: 0.85rem;
            color: var(--color-default);
            font-weight: 600;
            margin-top: 2px;
        }

        .modal-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
        }

        .modal-value {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: flex-end;
        }

        .ios-btn {
            background: var(--color-default);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка -->
        <div class="header">
            <h1>Аптечка</h1>
            <div class="stats-grid">
                <div class="stat-badge">
                    <span id="stat-valid" class="stat-value text-success">0</span>
                    <span class="stat-label">Годных</span>
                </div>
                <div class="stat-badge">
                    <span id="stat-expired" class="stat-value text-danger">0</span>
                    <span class="stat-label">Просрочено</span>
                </div>
                <div class="stat-badge">
                    <span id="stat-soon" class="stat-value text-warning">0</span>
                    <span class="stat-label">≤ 3 мес.</span>
                </div>
            </div>
        </div>

        <!-- Поиск и Сортировки -->
        <div class="controls-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск лекарства..." oninput="filterAndRender()">
            </div>
            
            <div class="sort-box">
                <span class="sort-label">Сортировка:</span>
                <select id="sortSelect" class="sort-select" onchange="filterAndRender()">
                    <option value="name">По названию (А - Я)</option>
                    <option value="fridgeFirst">Хранение в холодильнике (Холод.)</option>
                    <option value="locationFridge">Только в холодильнике</option>
                    <option value="locationCabinet">Только в шкафу</option>
                    <option value="tempCold">Со снежинкой (&lt; 24°C)</option>
                    <option value="expiredFirst">Сначала просроченные</option>
                    <option value="validFirst">Сначала годные</option>
                    <option value="dateAsc">По сроку (ранние сначала)</option>
                </select>
            </div>
        </div>

        <!-- Список -->
        <div id="medList" class="med-list">
            <div class="loader">Получение списка лекарств...</div>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        Версия 2.0 (by Ewgenoff 31.07.2026)
    </div>

    <!-- Модальное окно (iOS Style) -->
    <div class="modal-overlay" id="iosModal" onclick="closeModal(event)">
        <div class="ios-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="m-name">Название</div>
                <div class="modal-group" id="m-group">Группа</div>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <span class="modal-label">Описание / Назначение</span>
                    <span class="modal-value" id="m-desc">—</span>
                </div>
                <div class="modal-section">
                    <span class="modal-label">Температура хранения</span>
                    <span class="modal-value" id="m-temp">—</span>
                </div>
                <div class="modal-section">
                    <span class="modal-label">Разрешенный возраст</span>
                    <span class="modal-value" id="m-age">—</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="ios-btn" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROsTHKb21QaPxXxGW_xWgQJ5kKz3BKCfIsVHX6JSH4QOoqnhHDAxcuAbOtQYUiFKrKiODjlQSnLnUi/pub?gid=2071309898&single=true&output=csv";

        let medicines = [];

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            for (let line of lines) {
                if (!line.trim()) continue;
                let cells = [];
                let insideQuotes = false;
                let currentCell = '';
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"' || char === "'") {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        cells.push(currentCell.trim().replace(/^["']|["']$/g, ''));
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                cells.push(currentCell.trim().replace(/^["']|["']$/g, ''));
                result.push(cells);
            }
            return result;
        }

        function parseExpiryDate(dateStr) {
            if (!dateStr) return null;
            let str = dateStr.trim();
            let parts = str.split('.');
            if (parts.length === 3) {
                let day = parseInt(parts[0], 10);
                let month = parseInt(parts[1], 10) - 1;
                let year = parseInt(parts[2], 10);
                if (year < 100) year += 2000;
                return new Date(year, month, day, 23, 59, 59);
            }
            if (parts.length === 2) {
                let month = parseInt(parts[0], 10) - 1;
                let year = parseInt(parts[1], 10);
                if (year < 100) year += 2000;
                return new Date(year, month + 1, 0, 23, 59, 59);
            }
            let parsed = new Date(str);
            return !isNaN(parsed.getTime()) ? parsed : null;
        }

        // Извлечение температуры
        function parseTemp(tempStr) {
            if (!tempStr) return 99;
            const match = tempStr.match(/\d+/);
            return match ? parseInt(match[0], 10) : 99;
        }

        // Извлечение возраста
        function parseAge(ageStr) {
            if (!ageStr) return 0;
            const match = ageStr.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }

        async function fetchMedications() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Ошибка загрузки");
                
                const csvData = await response.text();
                const rows = parseCSV(csvData);

                medicines = [];
                const now = new Date();
                const threeMonthsLater = new Date();
                threeMonthsLater.setMonth(now.getMonth() + 3);

                let startIdx = 0;
                if (rows.length > 0 && rows[0][0] && (rows[0][0].toLowerCase().includes('назван') || rows[0][0].toLowerCase().includes('лекарст'))) {
                    startIdx = 1;
                }

                for (let i = startIdx; i < rows.length; i++) {
                    const row = rows[i];
                    const name = row[0] ? row[0].trim() : '';
                    if (!name) continue;

                    const colB = row[1] ? row[1].trim() : '';
                    const expiryRaw = row[2] ? row[2].trim() : '';
                    const group = row[4] ? row[4].trim() : ''; // E
                    const desc = row[5] ? row[5].trim() : '';  // F
                    const tempRaw = row[6] ? row[6].trim() : ''; // G
                    const ageRaw = row[7] ? row[7].trim() : '';  // H

                    const expiryDate = parseExpiryDate(expiryRaw);
                    const isExpired = expiryDate ? (expiryDate < now) : false;
                    const isExpiringSoon = expiryDate ? (!isExpired && expiryDate <= threeMonthsLater) : false;

                    const tempVal = parseTemp(tempRaw);
                    const ageVal = parseAge(ageRaw);

                    medicines.push({
                        id: i,
                        name: name,
                        colB: colB,
                        expiryRaw: expiryRaw,
                        expiryDate: expiryDate,
                        isExpired: isExpired,
                        isExpiringSoon: isExpiringSoon,
                        group: group,
                        desc: desc,
                        tempRaw: tempRaw,
                        tempVal: tempVal,
                        ageRaw: ageRaw,
                        ageVal: ageVal,
                        // Значки
                        isFridge: colB.toLowerCase().includes('холод'),
                        isCabinet: colB.toLowerCase().includes('шкаф'),
                        isNo: colB.toLowerCase() === 'нет',
                        isSnowflake: tempVal < 24,
                        isNoChild: ageVal >= 6
                    });
                }

                updateStats();
                filterAndRender();
            } catch (err) {
                console.error(err);
                document.getElementById('medList').innerHTML = `<div class="empty-msg">Не удалось загрузить данные из таблицы.</div>`;
            }
        }

        function updateStats() {
            const validCount = medicines.filter(m => !m.isExpired).length;
            const expiredCount = medicines.filter(m => m.isExpired).length;
            const soonCount = medicines.filter(m => m.isExpiringSoon).length;

            document.getElementById('stat-valid').textContent = validCount;
            document.getElementById('stat-expired').textContent = expiredCount;
            document.getElementById('stat-soon').textContent = soonCount;
        }

        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = medicines.filter(m => 
                m.name.toLowerCase().includes(query) || 
                m.colB.toLowerCase().includes(query) ||
                m.desc.toLowerCase().includes(query)
            );

            // Фильтрация и Сортировка
            if (sortVal === 'locationFridge') {
                filtered = filtered.filter(m => m.isFridge);
            } else if (sortVal === 'locationCabinet') {
                filtered = filtered.filter(m => m.isCabinet);
            } else if (sortVal === 'tempCold') {
                filtered = filtered.filter(m => m.isSnowflake);
            } else {
                filtered.sort((a, b) => {
                    if (sortVal === 'name') {
                        return a.name.localeCompare(b.name, 'ru');
                    } else if (sortVal === 'fridgeFirst') {
                        return (b.isFridge === a.isFridge) ? a.name.localeCompare(b.name, 'ru') : (b.isFridge ? 1 : -1);
                    } else if (sortVal === 'expiredFirst') {
                        return (b.isExpired === a.isExpired) ? a.name.localeCompare(b.name, 'ru') : (b.isExpired ? 1 : -1);
                    } else if (sortVal === 'validFirst') {
                        return (a.isExpired === b.isExpired) ? a.name.localeCompare(b.name, 'ru') : (a.isExpired ? 1 : -1);
                    } else if (sortVal === 'dateAsc') {
                        if (!a.expiryDate) return 1;
                        if (!b.expiryDate) return -1;
                        return a.expiryDate - b.expiryDate;
                    }
                    return 0;
                });
            }

            const container = document.getElementById('medList');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-msg">Лекарства не найдены</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                let classList = ['med-card'];
                if (item.isNo) classList.push('grayed');
                if (item.isExpired) classList.push('expired');
                else if (item.isExpiringSoon) classList.push('expiring-soon');

                // Формирование иконок
                let iconsHtml = '';
                if (item.isFridge) iconsHtml += '<span title="Холодильник">🧊</span>';
                if (item.isCabinet) iconsHtml += '<span title="Шкаф">🚪</span>';
                if (item.isSnowflake) iconsHtml += '<span title="Хранение ниже 24°C">❄️</span>';
                if (item.isNoChild) iconsHtml += '<span title="С 6 лет и старше">🚫👶</span>';

                // Бедж статуса
                let badgeHtml = '';
                if (item.isExpired) {
                    badgeHtml = `<span class="badge badge-expired">Просрочено</span>`;
                } else if (item.isExpiringSoon) {
                    badgeHtml = `<span class="badge badge-warning">Скоро</span>`;
                } else {
                    badgeHtml = `<span class="badge badge-valid">Годен</span>`;
                }

                return `
                    <div class="${classList.join(' ')}" ondblclick="openModal(${item.id})">
                        <div class="med-info">
                            <div class="med-name">${escapeHtml(item.name)}</div>
                            ${iconsHtml ? `<div class="med-icons">${iconsHtml}</div>` : ''}
                        </div>
                        <div class="med-status-badge">
                            <div class="med-date">${item.expiryRaw ? escapeHtml(item.expiryRaw) : '—'}</div>
                            ${badgeHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(id) {
            const med = medicines.find(m => m.id === id);
            if (!med) return;

            document.getElementById('m-name').textContent = med.name;
            document.getElementById('m-group').textContent = med.group || 'Группа не указана';
            document.getElementById('m-desc').textContent = med.desc || 'Нет описания';
            document.getElementById('m-temp').textContent = med.tempRaw || 'Не указана';
            document.getElementById('m-age').textContent = med.ageRaw || 'Любой возраст';

            document.getElementById('iosModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('iosModal').classList.remove('active');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        fetchMedications();
    </script>
</body>
</html>
