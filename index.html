<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Главная</title>
    <style>
        :root {
            /* Светлая тема */
            --bg-color: #F2F2F7;
            --gradient-tl: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.05) 0px, transparent 50%);
            --gradient-br: radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.04) 0px, transparent 50%);
            
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            
            --card-bg-glass: rgba(255, 255, 255, 0.75);
            --card-active-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 0.8);
            
            --color-default: #007AFF;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            --ios-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            
            --radius-card: 12px;
            --radius-control: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--ios-font);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--gradient-tl), var(--gradient-br);
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 16px 20px 16px;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        /* Плашки даты и времени */
        .datetime-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .chip {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-control);
            padding: 8px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-primary);
            box-shadow: var(--ios-shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .chip-time {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        /* Список карточек-кнопок */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Карточка-кнопка с эффектом стекла */
        .card {
            background: var(--card-bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            box-shadow: var(--ios-shadow);
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card:active {
            background-color: var(--card-active-bg);
            transform: scale(0.98);
        }

        /* Иконка */
        .row-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-control);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--card-border);
        }

        /* Контент и цвет текста */
        .row-content {
            flex-grow: 1;
        }

        .row-content h2 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--color-default);
        }

        /* Шеврон */
        .chevron {
            color: var(--color-default);
            font-size: 1.2rem;
            font-weight: 600;
            margin-left: 8px;
            opacity: 0.8;
        }

        /* Контейнер для двух кнопок в ряд */
        .row-container {
            display: flex;
            gap: 12px;
            width: 100%;
            flex-wrap: nowrap;
        }

        /* Компактные карточки */
        .card-small {
            flex: 1;
            padding: 12px 14px;
            justify-content: center;
        }

        .card-small .row-icon {
            width: 32px;
            height: 32px;
            font-size: 16px;
            margin-right: 10px;
        }

        .card-small .row-content h2 {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-small .chevron {
            display: none;
        }

        /* Подвал */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 24px;
            font-weight: 400;
        }

        /* === IOS MODAL (ALERT) STYLES === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ios-modal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            width: 80%;
            max-width: 300px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transform: scale(1.1);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
        }

        .modal-overlay.active .ios-modal {
            transform: scale(1);
            opacity: 1;
        }

        .modal-content {
            padding: 20px 16px 16px 16px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .modal-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .modal-button {
            width: 100%;
            padding: 14px;
            border: none;
            background: transparent;
            color: var(--color-default);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            transition: background-color 0.15s;
            font-family: var(--ios-font);
        }

        .modal-button:active {
            background-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Шапка -->
        <div class="header">
            <h1 id="greeting">Добро пожаловать!</h1>
            
            <!-- Плашки даты и времени -->
            <div class="datetime-chips">
                <div class="chip" id="chip-weekday">...</div>
                <div class="chip" id="chip-date">...</div>
                <div class="chip chip-time" id="chip-time">...</div>
            </div>
        </div>

        <!-- Кнопки-ссылки -->
        <div class="list-container">
            <!-- Вызов кастомного модального окна -->
            <a href="#" class="card" onclick="event.preventDefault(); showIosAlert('Офлайн режим', 'Упс... Доступ к странице ограничен офлайн режимом!');">
                <div class="row-icon">⏳</div>
                <div class="row-content">
                    <h2>Мой таймлайн</h2>
                </div>
                <div class="chevron">›</div>
            </a>

            <a href="MyFamily.html" class="card">
                <div class="row-icon">👨‍👩‍👧‍👦</div>
                <div class="row-content">
                    <h2>Мои родственники</h2>
                </div>
                <div class="chevron">›</div>
            </a>

            <a href="medications.html" class="card">
                <div class="row-icon">💊</div>
                <div class="row-content">
                    <h2>Лекарства</h2>
                </div>
                <div class="chevron">›</div>
            </a>

            <a href="LEGO.html" class="card">
                <div class="row-icon">🧱</div>
                <div class="row-content">
                    <h2>LEGO наборы</h2>
                </div>
                <div class="chevron">›</div>
            </a>

            <!-- Две маленькие кнопки в одну строку -->
            <div class="row-container">
                <a href="LEGO_Parsing.html" class="card card-small">
                    <div class="row-icon">🌐</div>
                    <div class="row-content">
                        <h2>Лего парсинг</h2>
                    </div>
                </a>

                <a href="LEGO_Find.html" class="card card-small">
                    <div class="row-icon">🔍</div>
                    <div class="row-content">
                        <h2>Поиск LEGO</h2>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- Подвал -->
    <div class="footer">
        Версия 1.3 (by Ewgenoff 05.08.2026)
    </div>

    <!-- HTML СТРУКТУРА МОДАЛЬНОГО ОКНА -->
    <div class="modal-overlay" id="iosAlertOverlay" onclick="hideIosAlert(event)">
        <div class="ios-modal" onclick="event.stopPropagation()">
            <div class="modal-content">
                <div class="modal-title" id="iosAlertTitle">Заголовок</div>
                <div class="modal-text" id="iosAlertText">Текст сообщения</div>
            </div>
            <button class="modal-button" onclick="hideIosAlert()">OK</button>
        </div>
    </div>

    <script>
        // Функции для управления модальным окном
        function showIosAlert(title, text) {
            document.getElementById('iosAlertTitle').textContent = title;
            document.getElementById('iosAlertText').textContent = text;
            document.getElementById('iosAlertOverlay').classList.add('active');
        }

        function hideIosAlert(event) {
            // Закрываем либо по клику на кнопку, либо по клику на фон (overlay)
            if (event) event.preventDefault();
            document.getElementById('iosAlertOverlay').classList.remove('active');
        }

        function updateWidget() {
            const now = new Date();
            const month = now.getMonth(); // 0-11 (Июль = 6)
            const day = now.getDate();
            const hours = now.getHours();

            // 1. Проверка Дня рождения (06 июля) и времени суток (без имени)
            const greetingEl = document.getElementById('greeting');
            if (month === 6 && day === 6) {
                greetingEl.textContent = "С Днем рождения!";
            } else {
                if (hours >= 4 && hours < 12) {
                    greetingEl.textContent = "Доброе утро!";
                } else if (hours >= 12 && hours < 17) {
                    greetingEl.textContent = "Добрый день!";
                } else if (hours >= 17 && hours < 23) {
                    greetingEl.textContent = "Добрый вечер!";
                } else {
                    greetingEl.textContent = "Доброй ночи!";
                }
            }

            // 2. День недели
            const weekday = now.toLocaleDateString('ru-RU', { weekday: 'long' });
            document.getElementById('chip-weekday').textContent = weekday.charAt(0).toUpperCase() + weekday.slice(1);

            // 3. Дата
            const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('chip-date').textContent = dateStr;

            // 4. Время (без буквы "в")
            const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('chip-time').textContent = timeStr;
        }

        updateWidget();
        setInterval(updateWidget, 1000);
    </script>
</body>
</html>
