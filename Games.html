<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки игр в стиле iOS</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(60, 60, 67, 0.12);
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --text-muted: #aeaeb2;
            
            --status-passed: #34c759;
            --status-passed-bg: rgba(52, 199, 89, 0.12);
            --status-playing: #ffcc00;
            --status-playing-bg: rgba(255, 204, 0, 0.15);
            --status-not-played: #8e8e93;
            --status-not-played-bg: rgba(142, 142, 147, 0.12);
            
            --score-high: #34c759;
            --score-high-bg: rgba(52, 199, 89, 0.12);
            --score-mid: #ff9500;
            --score-mid-bg: rgba(255, 149, 0, 0.12);
            --score-low: #ff3b30;
            --score-low-bg: rgba(255, 59, 48, 0.12);

            --badge-bg: #e5e5ea;
            --badge-text: #3a3a3c;
        }

        /* Автоматическая поддержка темной темы iOS */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.85);
                --card-border: rgba(84, 84, 88, 0.35);
                --text-primary: #ffffff;
                --text-secondary: #98989d;
                --text-muted: #636366;
                
                --badge-bg: #2c2c2e;
                --badge-text: #d1d1d6;

                --status-passed-bg: rgba(52, 199, 89, 0.2);
                --status-playing-bg: rgba(255, 204, 0, 0.2);
                --status-not-played-bg: rgba(142, 142, 147, 0.2);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px 8px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px; /* Узкие карточки */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 2px 4px;
            -webkit-overflow-scrolling: touch;
        }

        .cards-list::-webkit-scrollbar {
            width: 5px;
        }
        .cards-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .cards-list::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        /* Карточка в стиле iOS */
        .game-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
            display: grid;
            grid-template-columns: 52px 1fr 115px;
            grid-template-rows: auto auto;
            column-gap: 12px;
            row-gap: 8px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.15s ease;
        }

        .game-card:active {
            transform: scale(0.99);
        }

        /* ЛЕВАЯ КОЛОНКА: Оценка и Озвучка одинакового размера */
        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .score-badge, .audio-badge {
            width: 52px;
            height: 34px; /* Одинаковый размер */
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .score-high {
            color: var(--score-high);
            background: var(--score-high-bg);
        }

        .score-mid {
            color: var(--score-mid);
            background: var(--score-mid-bg);
        }

        .score-low {
            color: var(--score-low);
            background: var(--score-low-bg);
        }

        .audio-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 13px;
            font-weight: 600;
        }

        /* ЦЕНТРАЛЬНАЯ КОЛОНКА */
        .mid-col-top {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .title-en {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .title-ru {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mid-col-bottom {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Плашки в стиле iOS Pills */
        .ios-pill {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 8px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        .genre-pill {
            background-color: rgba(0, 122, 255, 0.12);
            color: #007aff;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            .genre-pill {
                background-color: rgba(10, 132, 255, 0.2);
                color: #0a84ff;
            }
        }

        /* ПРАВАЯ КОЛОНКА: Выровненные по размеру плашки */
        .right-col-top, .right-col-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: stretch;
        }

        .right-pill {
            width: 115px; /* Фиксированная ширина */
            height: 26px; /* Фиксированная высота */
            padding: 0 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            letter-spacing: -0.2px;
        }

        .status-passed {
            color: var(--status-passed);
            background: var(--status-passed-bg);
        }

        .status-playing {
            color: #d97706;
            background: var(--status-playing-bg);
        }

        .status-not-played {
            color: var(--status-not-played);
            background: var(--status-not-played-bg);
        }

        .time-pill {
            background-color: var(--badge-bg);
            color: var(--text-primary);
            font-weight: 600;
        }

        .date-pill {
            background-color: var(--badge-bg);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 10.5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        @media (max-width: 520px) {
            .game-card {
                grid-template-columns: 48px 1fr;
                grid-template-rows: auto auto auto;
            }
            .score-badge, .audio-badge {
                width: 48px;
                height: 32px;
                font-size: 13px;
            }
            .right-col-top, .right-col-bottom {
                grid-column: 2;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .right-pill {
                width: auto;
                flex: 1;
                min-width: 90px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">Библиотека Игр</h1>
    <div id="cards-container" class="cards-list">
        <div class="loading">Загрузка данных...</div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAaoLfMXIHoBoXTb16tXL_yabaMQThgsWGGrziE5InfpyEf3MIPkVkHD58xCapuR6IPeIRp6lnqLCl/pub?gid=0&single=true&output=csv';

    function parseCSV(text) {
        let lines = [];
        let row = [];
        let inQuotes = false;
        let currentToken = '';

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i + 1];

            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    currentToken += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                row.push(currentToken.trim());
                currentToken = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') {
                    i++;
                }
                row.push(currentToken.trim());
                if (row.length > 1 || row[0] !== '') {
                    lines.push(row);
                }
                row = [];
                currentToken = '';
            } else {
                currentToken += c;
            }
        }
        if (currentToken !== '' || row.length > 0) {
            row.push(currentToken.trim());
            lines.push(row);
        }
        return lines;
    }

    function formatHours(val) {
        if (!val) return '0ч';
        let cleaned = val.toString().replace(/[^0-9]/g, '');
        return cleaned ? cleaned + 'ч' : val + 'ч';
    }

    function renderCards(data) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        const rows = data.slice(1);

        rows.forEach(row => {
            if (!row || row.length < 2 || !row[1]) return;

            const titleEn = row[1] || 'Без названия';
            const titleRu = row[2] || '';
            const status = (row[3] || '').trim();
            const releaseDate = row[4] || '';
            const scoreNum = parseFloat(row[5]) || 0;
            const scoreText = row[5] || '—';
            const publisher = row[6] || '';
            const country = row[7] || '';
            const voiceover = (row[8] || '').toLowerCase();
            const genre = row[9] || '';
            const timeMain = row[11] || '';
            const timeFull = row[12] || '';

            // Статус
            let statusClass = 'status-not-played';
            let statusNorm = status.toLowerCase();
            if (statusNorm.includes('прошел') || statusNorm.includes('пройдено') || statusNorm.includes('готово')) {
                statusClass = 'status-passed';
            } else if (statusNorm.includes('играл') || statusNorm.includes('в процессе') || statusNorm.includes('играю')) {
                statusClass = 'status-playing';
            }

            // Оценка
            let scoreClass = 'score-low';
            if (scoreNum > 80) {
                scoreClass = 'score-high';
            } else if (scoreNum >= 65) {
                scoreClass = 'score-mid';
            }

            // Озвучка
            let hasRussianVoice = voiceover.includes('рус') || voiceover.includes('да') || voiceover.includes('озвучка') || voiceover.includes('rus');
            let audioBadgeText = hasRussianVoice ? 'RUS' : 'ENG';

            // Издатель / Страна
            let pubCountry = [publisher, country].filter(Boolean).join(' / ');

            // Время
            let timeStr = '';
            if (timeMain || timeFull) {
                let mainFormatted = formatHours(timeMain);
                let fullFormatted = formatHours(timeFull);
                timeStr = `${mainFormatted}/${fullFormatted}`;
            }

            const cardHtml = `
                <div class="game-card">
                    <!-- Слева: Оценка и Озвучка одинакового размера -->
                    <div class="left-col">
                        <div class="score-badge ${scoreClass}">${scoreText}</div>
                        <div class="audio-badge">${audioBadgeText}</div>
                    </div>

                    <!-- Центр Вверху: Названия -->
                    <div class="mid-col-top">
                        <div class="title-en" title="${titleEn}">${titleEn}</div>
                        ${titleRu ? `<div class="title-ru" title="${titleRu}">${titleRu}</div>` : ''}
                    </div>

                    <!-- Справа Вверху: Статус -->
                    <div class="right-col-top">
                        <div class="right-pill ${statusClass}">${status || 'Не играл'}</div>
                    </div>

                    <!-- Центр Внизу: Издатель/Страна и Жанр в плашках -->
                    <div class="mid-col-bottom">
                        ${pubCountry ? `<span class="ios-pill">${pubCountry}</span>` : ''}
                        ${genre ? `<span class="ios-pill genre-pill">${genre}</span>` : ''}
                    </div>

                    <!-- Справа Внизу: Время и Дата выхода в плашках -->
                    <div class="right-col-bottom">
                        ${timeStr ? `<div class="right-pill time-pill">${timeStr}</div>` : ''}
                        ${releaseDate ? `<div class="right-pill date-pill">${releaseDate}</div>` : ''}
                    </div>
                </div>
            `;

            container.innerHTML += cardHtml;
        });
    }

    fetch(CSV_URL)
        .then(response => response.text())
        .then(csvText => {
            const data = parseCSV(csvText);
            renderCards(data);
        })
        .catch(err => {
            console.error('Ошибка загрузки CSV:', err);
            document.getElementById('cards-container').innerHTML = `
                <div class="loading" style="color: #ff3b30;">
                    Не удалось загрузить данные из Google Таблицы.
                </div>`;
        });
</script>

</body>
</html>
