<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки игр</title>
    <style>
        :root {
            /* Только тёмная тема */
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.9);
            --card-border: rgba(84, 84, 88, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #98989d;
            --text-muted: #636366;
            
            --status-passed: #34c759;
            --status-passed-bg: rgba(52, 199, 89, 0.22);
            --status-playing: #ffcc00;
            --status-playing-bg: rgba(255, 204, 0, 0.22);
            --status-not-played: #8e8e93;
            --status-not-played-bg: rgba(142, 142, 147, 0.22);

            --badge-bg: #2c2c2e;
            --badge-text: #d1d1d6;
            --accent-blue: #0a84ff;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-top: 140px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 0 10px;
            flex: 1;
        }

        /* АВТОСКРЫВАЮЩАЯСЯ ШАПКА */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 16px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-hidden {
            transform: translateY(-100%);
        }

        /* Кнопки-счетчики */
        .counters-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .counter-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 0;
        }

        .counter-btn.active {
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        .counter-btn span {
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--text-primary);
        }

        .counter-btn.passed { border-color: rgba(52, 199, 89, 0.4); }
        .counter-btn.passed span { color: var(--status-passed); }

        .counter-btn.playing { border-color: rgba(255, 204, 0, 0.5); }
        .counter-btn.playing span { color: var(--status-playing); }

        .counter-btn.not-played { border-color: rgba(142, 142, 147, 0.4); }
        .counter-btn.not-played span { color: var(--status-not-played); }

        /* Поиск, Сброс и Сортировка */
        .controls-bar {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .search-wrapper {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: var(--badge-bg);
            border: none;
            border-radius: 10px;
            padding: 8px 65px 8px 34px;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0.7;
        }

        .search-counter {
            position: absolute;
            right: 10px;
            font-size: 11px;
            color: var(--text-secondary);
            pointer-events: none;
            font-weight: 600;
        }

        .reset-btn, .sort-btn {
            background: var(--badge-bg);
            color: var(--text-primary);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* 3. Красный цвет убран, добавлена синяя обводка */
        .reset-btn.active {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .sort-btn {
            background: var(--badge-bg);
            color: var(--text-primary);
        }

        /* 17. Расстояние между карточками 14px */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 18. Карточка больше по высоте (~100px) */
        .swipe-card-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            border-radius: 16px;
            overflow: hidden;
            touch-action: pan-y;
        }

        .game-card-back {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 1;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .card-back-cover {
            width: 77px;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--badge-bg);
        }

        .card-back-desc {
            flex: 1;
            font-size: 11.5px;
            line-height: 1.35;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* КАРТОЧКА ИГРЫ (11. Все обведены единой серой рамкой) */
        .game-card {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border) !important;
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: stretch;
            box-shadow: 0 2px 8px var(--shadow-color);
            cursor: pointer;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .game-card.swiping {
            transition: none !important;
        }

        /* 10. Левая колонка растянута в 1.5 раза */
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            width: 48px;
            height: 80px;
        }

        /* 19. Только цифра оценки, увеличенная в 2 раза */
        .score-number {
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            text-align: center;
        }

        /* Градация цветов оценки */
        .score-green { color: #34c759; }
        .score-cyan { color: #30d158; }
        .score-yellow { color: #ffd60a; }
        .score-orange { color: #ff9f0a; }
        .score-red { color: #ff453a; }

        .game-logo-container {
            width: 48px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        /* Центральная колонка */
        .mid-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .titles-block {
            display: flex;
            flex-direction: column;
        }

        /* 4. Название игры на 1pt больше (16px) */
        .title-en {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .title-ru {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* 6. Разработчик и страна отодвинуты чуть вниз */
        .dev-country-block {
            margin-top: 4px;
            font-size: 11px;
            line-height: 1.2;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* 12. #B5B7BA - цвет текста Разработчика */
        .text-dev {
            color: #B5B7BA;
            font-weight: 500;
            cursor: pointer;
        }

        /* 13. #F4F4F5 - цвет текста Страны */
        .text-country {
            color: #F4F4F5;
            font-weight: 500;
            cursor: pointer;
        }

        .mid-col-bottom {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        /* 14. Жанр - плашка фон: rgba(40, 130, 240, .15) , текст #4EA3FF */
        .genre-pill {
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 6px;
            background-color: rgba(40, 130, 240, 0.15);
            color: #4EA3FF;
            line-height: 1.1;
            cursor: pointer;
        }

        /* Правая колонка */
        .right-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
            height: 80px;
        }

        .right-pill {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 600;
            white-space: nowrap;
            width: max-content;
            max-width: 130px;
            text-align: right;
            line-height: 1.2;
        }

        .status-passed { color: var(--status-passed); background: var(--status-passed-bg); }
        .status-playing { color: var(--status-playing); background: var(--status-playing-bg); }
        .status-not-played { color: var(--status-not-played); background: var(--status-not-played-bg); }

        /* 21. Часы игры вместо геймпада */
        .time-pill { background-color: var(--badge-bg); color: var(--text-primary); }

        /* 19. Динамик и флаг над датой релиза */
        .voice-text {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: -2px;
        }

        /* 8. Дата релиза без плашки + 9. Значок ПК перед датой */
        .date-text {
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 12px;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            touch-action: none;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .carousel-wrapper {
            position: relative;
            width: 90%;
            max-width: 440px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flip-modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 100%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            max-height: 90vh;
            overflow-y: auto;
            cursor: pointer;
            user-select: none;
        }

        .modal-image-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px auto;
            border-radius: 12px;
            overflow: hidden;
            background: var(--badge-bg);
            display: flex; 
            align-items: center;
            justify-content: center;
        }

        .modal-image-link {
            display: block;
            width: 100%;
        }

        .modal-image-link img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-link { background: var(--accent-blue); color: #fff; }
        .btn-close { background: var(--badge-bg); color: var(--text-primary); }

        /* ПЛАВАЮЩАЯ КНОПКА ПОИСКА */
        .fab-search {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--accent-blue);
            border: none;
            border-radius: 50%;
            color: white;
            box-shadow: 0 4px 12px var(--shadow-color);
            cursor: pointer;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .fab-search.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .fab-search svg {
            width: 24px;
            height: 24px;
        }

        /* ОКНА СОРТИРОВКИ И ФИЛЬТРОВ */
        .ios-action-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 -4px 20px var(--shadow-color);
            z-index: 300;
            transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 80vh;
        }

        .ios-action-sheet.active {
            bottom: 20px;
        }

        .sheet-title {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .sheet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .sheet-btn {
            background: var(--badge-bg);
            border: none;
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .sheet-btn-cancel {
            background: rgba(255, 59, 48, 0.12);
            color: #ff3b30;
            margin-top: 4px;
        }

        .segment-control {
            display: flex;
            background: var(--badge-bg);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 6px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .segment-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 4px;
        }

        .filter-item-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--badge-bg);
            border-radius: 8px;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
        }

        .filter-item-btn span {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .logo-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }

        .logo-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .logo-modal-img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<header class="sticky-header" id="header">
    <div class="header-content">
        <div class="counters-bar">
            <div class="counter-btn passed" id="btn-count-passed" onclick="filterByStatus('passed')">Прошел <span id="count-passed">0</span></div>
            <div class="counter-btn playing" id="btn-count-playing" onclick="filterByStatus('playing')">Не закончил <span id="count-playing">0</span></div>
            <div class="counter-btn not-played" id="btn-count-not-played" onclick="filterByStatus('not-played')">В планах <span id="count-not-played">0</span></div>
        </div>
        <div class="controls-bar">
            <!-- 15. Поиск с 🔍 и "Название игры..." | 16. Кол-во справа в поле -->
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Название игры...">
                <span class="search-counter" id="search-counter">0/0</span>
            </div>
            <button class="reset-btn" id="reset-btn" onclick="resetAllFilters()">Сброс</button>
            <!-- 2. Сортировка серым цветом -->
            <button class="sort-btn" id="open-sort-btn">Сортировка</button>
        </div>
    </div>
</header>

<div class="container">
    <div id="cards-container" class="cards-list">
        <div class="loading">Загрузка данных...</div>
    </div>
</div>

<footer>
    <div>Общее кол-во записей: <strong id="total-count">0</strong></div>
    <div>Версия 1.2 (by Ewgenoff 11.08.2026)</div>
</footer>

<button id="fab-search" class="fab-search" aria-label="Поиск">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
</button>

<div class="modal-overlay" id="flip-modal-overlay">
    <div class="carousel-wrapper">
        <div class="flip-modal" id="flip-modal-card" onclick="closeFlipModalWithPrevent(event)">
            <div class="modal-image-container" id="modal-image-container">
                <div class="modal-image-link" id="modal-image-link">
                    <img id="modal-image" src="" alt="Обложка игры">
                </div>
            </div>
            <div class="modal-desc" id="modal-desc">Описание отсутствует.</div>
            <div class="modal-actions">
                <a href="#" target="_blank" class="modal-btn btn-link" id="modal-wiki-link" style="display: none;" onclick="event.stopPropagation()">Wiki.ru</a>
                <a href="#" target="_blank" class="modal-btn btn-link" id="modal-link" onclick="event.stopPropagation()">IGDB.com</a>
                <button class="modal-btn btn-close" id="modal-close" onclick="closeFlipModalWithPrevent(event)">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<div class="logo-modal-overlay" id="logo-modal-overlay" onclick="closeLogoModalWithPrevent(event)">
    <img id="logo-modal-img" class="logo-modal-img" src="" alt="Логотип игры">
</div>

<div class="modal-overlay" id="sort-overlay"></div>
<div class="ios-action-sheet" id="sort-sheet">
    <div class="sheet-title">Сортировка игр</div>
    <div class="sheet-grid">
        <button class="sheet-btn" data-sort="title">А-Я</button>
        <button class="sheet-btn" data-sort="year">Дата релиза (PC)</button>
        <button class="sheet-btn" data-sort="score">Оценка</button>
        <button class="sheet-btn" data-sort="developer">Разработчик</button>
        <button class="sheet-btn" data-sort="country">Страна</button>
        <button class="sheet-btn" data-sort="voice">Озвучка</button>
        <button class="sheet-btn" data-sort="time">Время прохождения</button>
    </div>
    <button class="sheet-btn sheet-btn-cancel" id="close-sort-btn">Отмена</button>
</div>

<div class="ios-action-sheet" id="pub-country-sheet">
    <div class="segment-control">
        <button class="segment-btn active" id="seg-dev" onclick="switchPubCountryTab('dev')">Разработчик</button>
        <button class="segment-btn" id="seg-country" onclick="switchPubCountryTab('country')">Страна</button>
    </div>
    <div class="filter-list" id="pub-country-list"></div>
    <button class="sheet-btn sheet-btn-cancel" onclick="closePubCountrySheet()">Отмена</button>
</div>

<div class="ios-action-sheet" id="genre-sheet">
    <div class="sheet-title">Фильтр по жанрам</div>
    <div class="filter-list" id="genre-list"></div>
    <button class="sheet-btn sheet-btn-cancel" onclick="closeGenreSheet()">Отмена</button>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAaoLfMXIHoBoXTb16tXL_yabaMQThgsWGGrziE5InfpyEf3MIPkVkHD58xCapuR6IPeIRp6lnqLCl/pub?gid=0&single=true&output=csv';

    let gamesData = [];
    let filteredGamesData = [];
    let currentModalIndex = -1;
    let currentLogoModalIndex = -1;

    let currentFilterText = '';
    let selectedStatusFilter = null;
    let selectedDeveloperFilter = null;
    let selectedCountryFilter = null;
    let selectedGenreFilter = null;
    let currentPubCountryTab = 'dev';
    let isSorted = false;

    function parseCSV(text) {
        let lines = [];
        let row = [];
        let inQuotes = false;
        let currentToken = '';

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i + 1];

            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    currentToken += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                row.push(currentToken.trim());
                currentToken = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') {
                    i++;
                }
                row.push(currentToken.trim());
                if (row.length > 1 || row[0] !== '') {
                    lines.push(row);
                }
                row = [];
                currentToken = '';
            } else {
                currentToken += c;
            }
        }
        if (currentToken !== '' || row.length > 0) {
            row.push(currentToken.trim());
            lines.push(row);
        }
        return lines;
    }

    // 21. Форматирование часов ХХ-ХХч без лишних знаков
    function formatHoursRange(main, full) {
        if (!main && !full) return '';
        let cleanMain = main ? main.toString().replace(/[^0-9]/g, '') : '';
        let cleanFull = full ? full.toString().replace(/[^0-9]/g, '') : '';
        
        if (cleanMain && cleanFull) return `${cleanMain}-${cleanFull}ч`;
        if (cleanMain) return `${cleanMain}ч`;
        if (cleanFull) return `${cleanFull}ч`;
        return '';
    }

    function getGameStatus(statusNorm) {
        if (!statusNorm) return 'not-played';
        if (statusNorm.includes('не играл') || statusNorm.includes('неиграл')) return 'not-played';
        if (statusNorm.includes('прошел') || statusNorm.includes('пройдено') || statusNorm.includes('готово')) return 'passed';
        if (statusNorm.includes('играл') || statusNorm.includes('в процессе') || statusNorm.includes('играю')) return 'playing';
        return 'not-played';
    }

    function updateCounters(data) {
        let passed = 0, playing = 0, notPlayed = 0;
        data.forEach(item => {
            const status = getGameStatus(item.statusNorm);
            if (status === 'passed') passed++;
            else if (status === 'playing') playing++;
            else notPlayed++;
        });

        document.getElementById('count-passed').textContent = passed;
        document.getElementById('count-playing').textContent = playing;
        document.getElementById('count-not-played').textContent = notPlayed;
        document.getElementById('total-count').textContent = data.length;
    }

    // 3. Синяя обводка только при фильтрации по стране, разработчику или жанру
    function checkResetButtonState() {
        const hasFilters = selectedDeveloperFilter || selectedCountryFilter || selectedGenreFilter;
        const resetBtn = document.getElementById('reset-btn');
        if (hasFilters) {
            resetBtn.classList.add('active');
        } else {
            resetBtn.classList.remove('active');
        }
    }

    function filterByStatus(type) {
        if (selectedStatusFilter === type) {
            selectedStatusFilter = null;
        } else {
            selectedStatusFilter = type;
        }

        document.querySelectorAll('.counter-btn').forEach(btn => btn.classList.remove('active'));
        if (selectedStatusFilter) {
            document.getElementById(`btn-count-${selectedStatusFilter}`).classList.add('active');
        }

        renderCards(gamesData);
    }

    function resetAllFilters() {
        currentFilterText = '';
        selectedStatusFilter = null;
        selectedDeveloperFilter = null;
        selectedCountryFilter = null;
        selectedGenreFilter = null;
        isSorted = false;
        
        document.getElementById('search-input').value = '';
        document.querySelectorAll('.counter-btn').forEach(btn => btn.classList.remove('active'));
        
        renderCards(gamesData);
    }

    function resetAllSwipedCards() {
        document.querySelectorAll('.game-card').forEach(card => {
            card.style.transform = 'translateX(0px)';
        });
    }

    function renderCards(data) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        checkResetButtonState();

        filteredGamesData = data.filter(item => {
            if (currentFilterText) {
                const term = currentFilterText.toLowerCase();
                const matchSearch = item.titleEn.toLowerCase().includes(term) ||
                                   item.titleRu.toLowerCase().includes(term) ||
                                   item.genre.toLowerCase().includes(term) ||
                                   item.developer.toLowerCase().includes(term);
                if (!matchSearch) return false;
            }

            if (selectedStatusFilter) {
                if (getGameStatus(item.statusNorm) !== selectedStatusFilter) return false;
            }

            if (selectedDeveloperFilter && item.developer !== selectedDeveloperFilter) return false;
            if (selectedCountryFilter && item.country !== selectedCountryFilter) return false;

            if (selectedGenreFilter) {
                const genres = item.genre ? item.genre.split(',').map(g => g.trim()) : [];
                if (!genres.includes(selectedGenreFilter)) return false;
            }

            return true;
        });

        // 16. Кол-во найденных карточек справа в инпуте
        const searchCounter = document.getElementById('search-counter');
        searchCounter.textContent = `${filteredGamesData.length}/${gamesData.length}`;

        if (filteredGamesData.length === 0) {
            container.innerHTML = `<div class="loading">Ничего не найдено</div>`;
            return;
        }

        filteredGamesData.forEach((item, index) => {
            const status = getGameStatus(item.statusNorm);
            let statusClass = `status-${status}`;

            // 19. Цветовая градация оценки
            let scoreClass = 'score-red';
            if (item.scoreNum >= 90) scoreClass = 'score-green';
            else if (item.scoreNum >= 80) scoreClass = 'score-cyan';
            else if (item.scoreNum >= 70) scoreClass = 'score-yellow';
            else if (item.scoreNum >= 60) scoreClass = 'score-orange';

            // 19. Динамик и язык
            let voiceText = item.voiceover.includes('есть') ? '🔈 РУ' : '🔈 EN';

            // 21. Иконка часов вместо геймпада
            let formattedTime = formatHoursRange(item.timeMain, item.timeFull);
            let timeStr = formattedTime ? `⏱️ ${formattedTime}` : '';

            const wrapper = document.createElement('div');
            wrapper.className = 'swipe-card-wrapper';

            const cardBack = document.createElement('div');
            cardBack.className = 'game-card-back';
            cardBack.innerHTML = `
                <img src="${item.image || ''}" alt="Обложка" class="card-back-cover" onerror="this.style.opacity='0'">
                <div class="card-back-desc">${item.description || 'Описание отсутствует.'}</div>
            `;

            const card = document.createElement('div');
            card.className = `game-card`;

            card.innerHTML = `
                <!-- 10. Левая колонка -->
                <div class="left-col">
                    <!-- 19. Оценка крупной цифрой без плашки -->
                    <div class="score-number ${scoreClass}">${item.scoreText}</div>
                    <div class="game-logo-container">
                        ${item.logo ? `<img src="${item.logo}" alt="Logo" class="game-logo" loading="lazy" onclick="event.stopPropagation(); openLogoModalByIndex(${index})">` : ''}
                    </div>
                </div>

                <!-- Центральная колонка -->
                <div class="mid-col">
                    <div class="titles-block">
                        <!-- 4. Название на 1pt больше | 5. Без линии -->
                        <div class="title-en">${item.titleEn}</div>
                        ${item.titleRu ? `<div class="title-ru">${item.titleRu}</div>` : ''}
                    </div>
                    <!-- 6. Разработчик и страна чуть ниже -->
                    <div class="dev-country-block">
                        <!-- 12. Разработчик #B5B7BA -->
                        ${item.developer ? `<span class="text-dev" onclick="event.stopPropagation(); filterByDev('${item.developer}')">${item.developer}</span>` : ''}
                        ${item.developer && item.country ? `<span style="color: #636366;">/</span>` : ''}
                        <!-- 13. Страна #F4F4F5 | 7. Без флага -->
                        ${item.country ? `<span class="text-country" onclick="event.stopPropagation(); filterByCountry('${item.country}')">${item.country}</span>` : ''}
                    </div>
                    <div class="mid-col-bottom">
                        <!-- 14. Жанр плашка -->
                        ${item.genre ? `<span class="genre-pill" onclick="event.stopPropagation(); openGenreSheet()">${item.genre}</span>` : ''}
                    </div>
                </div>

                <!-- Правая колонка -->
                <div class="right-col">
                    <div class="right-pill ${statusClass}">${item.status || 'В планах'}</div>
                    ${timeStr ? `<div class="right-pill time-pill">${timeStr}</div>` : ''}
                    <!-- 19. Динамик над датой -->
                    <div class="voice-text">${voiceText}</div>
                    <!-- 8. Дата не в плашке | 9. Значок ПК -->
                    ${item.releaseDate ? `<div class="date-text">💻 ${item.releaseDate}</div>` : ''}
                </div>
            `;

            wrapper.appendChild(cardBack);
            wrapper.appendChild(card);
            container.appendChild(wrapper);

            // 20. Открытие Wikipedia по двойному тапу/клику по всей карточке
            card.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (item.wiki) {
                    window.open(item.wiki, '_blank');
                }
            });

            // ЛОГИКА СВАЙПА МИНИ-КАРТОЧКИ (Свайп влево/вправо)
            let startX = 0, startY = 0, currentTranslateX = 0, isSwiping = false, isTap = true;

            const handleTouchStart = (e) => {
                if (e.target.closest('.genre-pill, .game-logo, .text-dev, .text-country')) return;
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                isSwiping = true;
                isTap = true;
                card.classList.add('swiping');
            };

            const handleTouchMove = (e) => {
                if (!isSwiping) return;
                const touch = e.touches ? e.touches[0] : e;
                const diffX = touch.clientX - startX;
                const diffY = touch.clientY - startY;

                if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                    isTap = false;
                }

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (e.cancelable) e.preventDefault();
                    let targetX = currentTranslateX + diffX;
                    if (targetX > 220) targetX = 220;
                    if (targetX < -220) targetX = -220;
                    card.style.transform = `translateX(${targetX}px)`;
                }
            };

            const handleTouchEnd = (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                card.classList.remove('swiping');

                const endTouch = e.changedTouches ? e.changedTouches[0] : e;
                const totalDiffX = endTouch.clientX - startX;

                if (isTap) {
                    openFlipModalByIndex(index);
                    return;
                }

                if (Math.abs(totalDiffX) > 60) {
                    resetAllSwipedCards();
                    const finalX = totalDiffX > 0 ? 200 : -200;
                    card.style.transform = `translateX(${finalX}px)`;
                    currentTranslateX = finalX;
                } else {
                    card.style.transform = 'translateX(0px)';
                    currentTranslateX = 0;
                }
            };

            card.addEventListener('touchstart', handleTouchStart, { passive: false });
            card.addEventListener('touchmove', handleTouchMove, { passive: false });
            card.addEventListener('touchend', handleTouchEnd);

            card.addEventListener('mousedown', handleTouchStart);
            window.addEventListener('mousemove', (e) => { if (isSwiping) handleTouchMove(e); });
            window.addEventListener('mouseup', (e) => { if (isSwiping) handleTouchEnd(e); });
        });
    }

    function filterByDev(dev) {
        selectedDeveloperFilter = dev;
        selectedCountryFilter = null;
        renderCards(gamesData);
    }

    function filterByCountry(country) {
        selectedCountryFilter = country;
        selectedDeveloperFilter = null;
        renderCards(gamesData);
    }

    function openFlipModalByIndex(index) {
        currentModalIndex = index;
        const item = filteredGamesData[index];
        if (item) openFlipModal(item);
    }

    function openLogoModalByIndex(index) {
        currentLogoModalIndex = index;
        const item = filteredGamesData[index];
        if (item && item.logo) openLogoModal(item.logo);
    }

    // ЗАГРУЗКА ДАННЫХ
    fetch(CSV_URL)
        .then(res => res.text())
        .then(csvText => {
            const parsed = parseCSV(csvText);
            const rows = parsed.slice(1);

            gamesData = rows.map((row, index) => {
                if (!row || row.length < 2 || !row[1]) return null;
                return {
                    id: 'game_' + index,
                    titleEn: row[1] || 'Без названия',
                    titleRu: row[2] || '',
                    status: (row[3] || '').trim(),
                    statusNorm: (row[3] || '').trim().toLowerCase(),
                    releaseDate: row[4] || '',
                    scoreNum: parseFloat(row[5]) || 0,
                    scoreText: row[5] || '—',
                    developer: row[6] || '',
                    country: row[7] || '',
                    voiceover: (row[8] || '').trim().toLowerCase(),
                    genre: row[9] || '',
                    timeMain: row[11] || '',
                    timeFull: row[12] || '',
                    link: row[14] || '',
                    description: row[15] || '',
                    image: row[18] || '', // Столбец S
                    logo: row[19] || '',  // Столбец T
                    wiki: row[20] || ''   // Столбец U
                };
            }).filter(Boolean);

            updateCounters(gamesData);
            renderCards(gamesData);
        })
        .catch(err => {
            console.error(err);
            document.getElementById('cards-container').innerHTML = `
                <div class="loading" style="color: #ff3b30;">Ошибка загрузки данных Таблицы</div>`;
        });

    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => {
        currentFilterText = e.target.value;
        renderCards(gamesData);
    });

    let lastScrollY = window.scrollY;
    const header = document.getElementById('header');
    const fabSearch = document.getElementById('fab-search');
    let scrollTimeout;

    window.addEventListener('scroll', () => {
        resetAllSwipedCards();

        if (window.scrollY > lastScrollY && window.scrollY > 80) {
            header.classList.add('header-hidden');
        } else {
            header.classList.remove('header-hidden');
        }
        lastScrollY = window.scrollY;

        fabSearch.classList.add('active');
        
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            fabSearch.classList.remove('active');
        }, 2000);
    });

    fabSearch.addEventListener('click', () => {
        header.classList.remove('header-hidden');
        searchInput.focus();
    });

    const flipOverlay = document.getElementById('flip-modal-overlay');
    const flipModalCard = document.getElementById('flip-modal-card');

    function populateCardContent(cardElement, item) {
        if (!item) return;
        const imgDisplay = item.image ? 'flex' : 'none';
        const wikiDisplay = item.wiki ? 'inline-flex' : 'none';
        const linkDisplay = item.link ? 'inline-flex' : 'none';
        
        cardElement.innerHTML = `
            <div class="modal-image-container" style="display: ${imgDisplay};">
                <div class="modal-image-link">
                    <img src="${item.image || ''}" alt="Обложка игры">
                </div>
            </div>
            <div class="modal-desc">${item.description || 'Описание не заполнено.'}</div>
            <div class="modal-actions">
                <a href="${item.wiki || '#'}" target="_blank" class="modal-btn btn-link" style="display: ${wikiDisplay};" onclick="event.stopPropagation()">Wiki.ru</a>
                <a href="${item.link || '#'}" target="_blank" class="modal-btn btn-link" style="display: ${linkDisplay};" onclick="event.stopPropagation()">IGDB.com</a>
                <button class="modal-btn btn-close" onclick="closeFlipModalWithPrevent(event)">Закрыть</button>
            </div>
        `;
    }

    function openFlipModal(item) {
        populateCardContent(flipModalCard, item);
        flipOverlay.classList.add('active');
    }

    function closeFlipModalWithPrevent(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        flipOverlay.classList.remove('active');
    }

    flipOverlay.onclick = (e) => {
        closeFlipModalWithPrevent(e);
    };

    const logoOverlay = document.getElementById('logo-modal-overlay');
    const logoImg = document.getElementById('logo-modal-img');

    function openLogoModal(src) {
        logoImg.src = src;
        logoOverlay.classList.add('active');
    }

    function closeLogoModalWithPrevent(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        logoOverlay.classList.remove('active');
    }

    // СОРТИРОВКА
    const sortOverlay = document.getElementById('sort-overlay');
    const sortSheet = document.getElementById('sort-sheet');
    const openSortBtn = document.getElementById('open-sort-btn');
    const closeSortBtn = document.getElementById('close-sort-btn');

    openSortBtn.onclick = () => {
        sortOverlay.classList.add('active');
        sortSheet.classList.add('active');
    };

    function closeSortSheet() {
        sortOverlay.classList.remove('active');
        sortSheet.classList.remove('active');
    }

    closeSortBtn.onclick = closeSortSheet;
    sortOverlay.onclick = () => {
        closeSortSheet();
        closePubCountrySheet();
        closeGenreSheet();
    };

    document.querySelectorAll('.sheet-btn[data-sort]').forEach(btn => {
        btn.onclick = () => {
            const type = btn.getAttribute('data-sort');
            isSorted = true;
            
            const dateToNum = (dateStr) => {
                if (!dateStr) return 0;
                const parts = dateStr.toString().split(/[.,\/]/).map(p => p.trim());
                if (parts.length === 3) {
                    const day = parts[0].padStart(2, '0');
                    const month = parts[1].padStart(2, '0');
                    const year = parts[2];
                    return parseInt(`${year}${month}${day}`, 10);
                }
                return 0;
            };

            gamesData.sort((a, b) => {
                switch(type) {
                    case 'title': return a.titleEn.localeCompare(b.titleEn);
                    case 'year': return dateToNum(b.releaseDate) - dateToNum(a.releaseDate);
                    case 'score': return b.scoreNum - a.scoreNum;
                    case 'developer': return a.developer.localeCompare(b.developer);
                    case 'country': return a.country.localeCompare(b.country);
                    case 'voice': return a.voiceover.localeCompare(b.voiceover);
                    case 'time': return (parseInt(b.timeMain)||0) - (parseInt(a.timeMain)||0);
                    default: return 0;
                }
            });

            renderCards(gamesData);
            closeSortSheet();
        };
    });

    const pubCountrySheet = document.getElementById('pub-country-sheet');

    function openPubCountrySheet() {
        sortOverlay.classList.add('active');
        pubCountrySheet.classList.add('active');
        renderPubCountryList();
    }

    function closePubCountrySheet() {
        pubCountrySheet.classList.remove('active');
        if (!sortSheet.classList.contains('active') && !genreSheet.classList.contains('active')) {
            sortOverlay.classList.remove('active');
        }
    }

    function switchPubCountryTab(tab) {
        currentPubCountryTab = tab;
        document.getElementById('seg-dev').classList.toggle('active', tab === 'dev');
        document.getElementById('seg-country').classList.toggle('active', tab === 'country');
        renderPubCountryList();
    }

    function renderPubCountryList() {
        const listContainer = document.getElementById('pub-country-list');
        listContainer.innerHTML = '';

        const counts = {};
        gamesData.forEach(item => {
            const val = currentPubCountryTab === 'dev' ? item.developer : item.country;
            if (val) {
                counts[val] = (counts[val] || 0) + 1;
            }
        });

        const sortedKeys = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ru'));

        sortedKeys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'filter-item-btn';
            btn.innerHTML = `${key} <span>(${counts[key]})</span>`;
            
            btn.onclick = () => {
                if (currentPubCountryTab === 'dev') {
                    selectedDeveloperFilter = key;
                    selectedCountryFilter = null;
                } else {
                    selectedCountryFilter = key;
                    selectedDeveloperFilter = null;
                }
                renderCards(gamesData);
                closePubCountrySheet();
            };
            listContainer.appendChild(btn);
        });
    }

    const genreSheet = document.getElementById('genre-sheet');

    function openGenreSheet() {
        sortOverlay.classList.add('active');
        genreSheet.classList.add('active');
        renderGenreList();
    }

    function closeGenreSheet() {
        genreSheet.classList.remove('active');
        if (!sortSheet.classList.contains('active') && !pubCountrySheet.classList.contains('active')) {
            sortOverlay.classList.remove('active');
        }
    }

    function renderGenreList() {
        const listContainer = document.getElementById('genre-list');
        listContainer.innerHTML = '';

        const counts = {};
        gamesData.forEach(item => {
            if (item.genre) {
                item.genre.split(',').forEach(g => {
                    const trimmedG = g.trim();
                    if (trimmedG) {
                        counts[trimmedG] = (counts[trimmedG] || 0) + 1;
                    }
                });
            }
        });

        const sortedKeys = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ru'));

        sortedKeys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'filter-item-btn';
            btn.innerHTML = `${key} <span>(${counts[key]})</span>`;
            btn.onclick = () => {
                selectedGenreFilter = key;
                renderCards(gamesData);
                closeGenreSheet();
            };
            listContainer.appendChild(btn);
        });
    }
</script>

</body>
</html>
