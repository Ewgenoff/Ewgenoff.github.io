<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список игр</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --cell-bg: #0f172a;
            
            --status-passed: #10b981;
            --status-played: #eab308;
            --status-not-played: #64748b;

            --score-high: #22c55e;
            --score-mid: #eab308;
            --score-low: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 1.2rem;
        }

        /* Карточка игры */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.7);
        }

        /* Блок с обложкой */
        .cover-container {
            position: relative;
            width: 240px;
            min-width: 240px;
            height: 320px;
            background-color: #020617;
            overflow: hidden;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Плашки поверх обложки */
        .badge {
            position: absolute;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
        }

        .score-badge {
            top: 12px;
            left: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            min-width: 36px;
            text-align: center;
        }

        .status-badge {
            top: 12px;
            right: 12px;
            color: #ffffff;
        }

        /* Цвета оценок */
        .bg-score-high { background-color: rgba(34, 197, 94, 0.9); }
        .bg-score-mid { background-color: rgba(234, 179, 8, 0.9); }
        .bg-score-low { background-color: rgba(239, 68, 68, 0.9); }

        /* Цвета статусов */
        .bg-status-passed { background-color: rgba(16, 185, 129, 0.9); }
        .bg-status-played { background-color: rgba(234, 179, 8, 0.9); }
        .bg-status-none { background-color: rgba(100, 116, 139, 0.9); }

        /* Правая часть карточки */
        .card-content {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .header-group {
            margin-bottom: 16px;
        }

        .title-orig {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .title-ru {
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* Плитки информации G, H, J */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: auto;
        }

        .info-cell {
            background-color: var(--cell-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cell-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            font-weight: 600;
        }

        .cell-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .game-card {
                flex-direction: column;
            }
            .cover-container {
                width: 100%;
                height: 250px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="cards-container">
    <div class="loading">Загрузка данных из Гугл Таблицы...</div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAaoLfMXIHoBoXTb16tXL_yabaMQThgsWGGrziE5InfpyEf3MIPkVkHD58xCapuR6IPeIRp6lnqLCl/pub?gid=0&single=true&output=csv';

    function parseCSV(text) {
        const lines = [];
        let row = [];
        let inQuotes = false;
        let currentVal = '';

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    currentVal += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                row.push(currentVal.trim());
                currentVal = '';
            } else if ((char === '\r' || char === '\n') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++;
                row.push(currentVal.trim());
                if (row.length > 1 || row[0] !== '') lines.push(row);
                row = [];
                currentVal = '';
            } else {
                currentVal += char;
            }
        }
        if (currentVal || row.length > 0) {
            row.push(currentVal.trim());
            lines.push(row);
        }
        return lines;
    }

    function getScoreClass(scoreNum) {
        if (isNaN(scoreNum)) return 'bg-score-low';
        if (scoreNum > 80) return 'bg-score-high';
        if (scoreNum >= 65) return 'bg-score-mid';
        return 'bg-score-low';
    }

    function getStatusClass(statusText) {
        const status = (statusText || '').toLowerCase().trim();
        if (status.includes('прошел') || status.includes('пройдено') || status.includes('завершено')) {
            return 'bg-status-passed';
        } else if (status.includes('играл') || status.includes('в процессе')) {
            return 'bg-status-played';
        }
        return 'bg-status-none';
    }

    async function loadGames() {
        const container = document.getElementById('cards-container');
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error('Ошибка сети при запросе CSV');
            const csvData = await response.text();
            const rows = parseCSV(csvData);

            if (rows.length <= 1) {
                container.innerHTML = '<div class="loading">Нет данных в таблице</div>';
                return;
            }

            const headers = rows[0];
            const colGLabel = headers[6] || 'Инфо G';
            const colHLabel = headers[7] || 'Инфо H';
            const colJLabel = headers[9] || 'Инфо J';

            container.innerHTML = '';

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue;

                const nameOrig = row[1] || 'Без названия';
                const nameRu = row[2] || '';
                const status = row[3] || 'Не играл';
                const scoreRaw = row[5] || '-';
                const valG = row[6] || '-';
                const valH = row[7] || '-';
                const valJ = row[9] || '-';
                const coverUrl = row[13] || 'https://via.placeholder.com/240x320?text=No+Cover';

                const scoreNum = parseFloat(scoreRaw);
                const scoreClass = getScoreClass(scoreNum);
                const statusClass = getStatusClass(status);

                const cardHtml = `
                    <div class="game-card">
                        <div class="cover-container">
                            <img class="cover-img" src="${coverUrl}" alt="${nameOrig}" onerror="this.src='https://via.placeholder.com/240x320?text=Error'">
                            <div class="badge score-badge ${scoreClass}">${scoreRaw}</div>
                            <div class="badge status-badge ${statusClass}">${status}</div>
                        </div>
                        <div class="card-content">
                            <div class="header-group">
                                <div class="title-orig">${nameOrig}</div>
                                ${nameRu ? `<div class="title-ru">${nameRu}</div>` : ''}
                            </div>
                            <div class="info-grid">
                                <div class="info-cell">
                                    <span class="cell-label">${colGLabel}</span>
                                    <span class="cell-value">${valG}</span>
                                </div>
                                <div class="info-cell">
                                    <span class="cell-label">${colHLabel}</span>
                                    <span class="cell-value">${valH}</span>
                                </div>
                                <div class="info-cell">
                                    <span class="cell-label">${colJLabel}</span>
                                    <span class="cell-value">${valJ}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.insertAdjacentHTML('beforeend', cardHtml);
            }

        } catch (error) {
            console.error(error);
            container.innerHTML = `<div class="loading" style="color: #ef4444;">Ошибка загрузки: ${error.message}</div>`;
        }
    }

    loadGames();
</script>

</body>
</html>
