<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки игр</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --status-passed: #22c55e;
            --status-passed-bg: rgba(34, 197, 94, 0.15);
            --status-playing: #eab308;
            --status-playing-bg: rgba(234, 179, 8, 0.15);
            --status-not-played: #94a3b8;
            --status-not-played-bg: rgba(148, 163, 184, 0.15);
            
            --score-high: #22c55e;
            --score-mid: #eab308;
            --score-low: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        /* Контейнер карточек со скроллом */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        /* Кастомный скроллбар */
        .cards-list::-webkit-scrollbar {
            width: 8px;
        }
        .cards-list::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 4px;
        }
        .cards-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .cards-list::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Структура карточки по схеме */
        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 18px;
            display: grid;
            grid-template-columns: 60px 1fr auto;
            grid-template-rows: auto auto;
            column-gap: 16px;
            row-gap: 10px;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .game-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        /* Слева: Оценка и Русская озвучка */
        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .score-badge {
            width: 52px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            border: 2px solid;
            background: rgba(0,0,0,0.2);
        }

        .score-high {
            color: var(--score-high);
            border-color: var(--score-high);
            background: rgba(34, 197, 94, 0.1);
        }

        .score-mid {
            color: var(--score-mid);
            border-color: var(--score-mid);
            background: rgba(234, 179, 8, 0.1);
        }

        .score-low {
            color: var(--score-low);
            border-color: var(--score-low);
            background: rgba(239, 68, 68, 0.1);
        }

        .audio-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--text-secondary);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }

        /* Центр: Названия, Издатель/Страна, Жанр */
        .mid-col-top {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-en {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .title-ru {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 3px;
            font-weight: 400;
        }

        .mid-col-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .genre-badge {
            font-size: 11px;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Справа: Статус, Время, Дата выходы */
        .right-col-top {
            display: flex;
            justify-content: flex-end;
        }

        .status-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid;
            text-align: center;
            display: inline-block;
        }

        .status-passed {
            color: var(--status-passed);
            background: var(--status-passed-bg);
            border-color: rgba(34, 197, 94, 0.4);
        }

        .status-playing {
            color: var(--status-playing);
            background: var(--status-playing-bg);
            border-color: rgba(234, 179, 8, 0.4);
        }

        .status-not-played {
            color: var(--status-not-played);
            background: var(--status-not-played-bg);
            border-color: rgba(148, 163, 184, 0.4);
        }

        .right-col-bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .play-time {
            font-weight: 600;
            color: var(--text-primary);
        }

        .release-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .game-card {
                grid-template-columns: 50px 1fr;
                grid-template-rows: auto auto auto;
            }
            .right-col-top, .right-col-bottom {
                align-items: flex-start;
                justify-content: flex-start;
            }
            .right-col-bottom {
                grid-column: 2;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="header-title">Список Игр</h1>
    <div id="cards-container" class="cards-list">
        <div class="loading">Загрузка данных из Google Таблицы...</div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAaoLfMXIHoBoXTb16tXL_yabaMQThgsWGGrziE5InfpyEf3MIPkVkHD58xCapuR6IPeIRp6lnqLCl/pub?gid=0&single=true&output=csv';

    // Парсер CSV с учетом кавычек и запятых
    function parseCSV(text) {
        let lines = [];
        let row = [];
        let inQuotes = false;
        let currentToken = '';

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i + 1];

            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    currentToken += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                row.push(currentToken.trim());
                currentToken = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') {
                    i++;
                }
                row.push(currentToken.trim());
                if (row.length > 1 || row[0] !== '') {
                    lines.push(row);
                }
                row = [];
                currentToken = '';
            } else {
                currentToken += c;
            }
        }
        if (currentToken !== '' || row.length > 0) {
            row.push(currentToken.trim());
            lines.push(row);
        }
        return lines;
    }

    function formatHours(val) {
        if (!val) return '0ч';
        let cleaned = val.toString().replace(/[^0-9]/g, '');
        return cleaned ? cleaned + 'ч' : val + 'ч';
    }

    function renderCards(data) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        // Пропускаем заголовок таблицы (строку 0)
        const rows = data.slice(1);

        rows.forEach(row => {
            if (!row || row.length < 2 || !row[1]) return;

            // Индексы столбцов (A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9, L=11, M=12):
            const titleEn = row[1] || 'Без названия';
            const titleRu = row[2] || '';
            const status = (row[3] || '').trim();
            const releaseDate = row[4] || '';
            const scoreNum = parseFloat(row[5]) || 0;
            const scoreText = row[5] || '—';
            const publisher = row[6] || '';
            const country = row[7] || '';
            const voiceover = (row[8] || '').toLowerCase();
            const genre = row[9] || '';
            const timeMain = row[11] || '';
            const timeFull = row[12] || '';

            // 1. Статус прохождения (D)
            let statusClass = 'status-not-played';
            let statusNorm = status.toLowerCase();
            if (statusNorm.includes('прошел') || statusNorm.includes('пройдено') || statusNorm.includes('готово')) {
                statusClass = 'status-passed';
            } else if (statusNorm.includes('играл') || statusNorm.includes('в процессе') || statusNorm.includes('играю')) {
                statusClass = 'status-playing';
            }

            // 2. Цвет оценки (F)
            let scoreClass = 'score-low';
            if (scoreNum > 80) {
                scoreClass = 'score-high';
            } else if (scoreNum >= 65) {
                scoreClass = 'score-mid';
            }

            // 3. Русификация/Озвучка (I)
            let hasRussianVoice = voiceover.includes('рус') || voiceover.includes('да') || voiceover.includes('озвучка') || voiceover.includes('rus');
            let audioBadgeText = hasRussianVoice ? 'RUS' : 'ENG';

            // 4. Издатель / Страна (G и H)
            let pubCountry = [publisher, country].filter(Boolean).join(' / ');

            // 5. Время прохождения ХХч/ХХч (L и M)
            let timeStr = '';
            if (timeMain || timeFull) {
                let mainFormatted = formatHours(timeMain);
                let fullFormatted = formatHours(timeFull);
                timeStr = `${mainFormatted}/${fullFormatted}`;
            }

            const cardHtml = `
                <div class="game-card">
                    <!-- Слева: Оценка и Озвучка -->
                    <div class="left-col">
                        <div class="score-badge ${scoreClass}">${scoreText}</div>
                        <div class="audio-badge">${audioBadgeText}</div>
                    </div>

                    <!-- По центру: Названия -->
                    <div class="mid-col-top">
                        <div class="title-en">${titleEn}</div>
                        ${titleRu ? `<div class="title-ru">${titleRu}</div>` : ''}
                    </div>

                    <!-- Справа вверху: Статус -->
                    <div class="right-col-top">
                        <div class="status-badge ${statusClass}">${status || 'Не играл'}</div>
                    </div>

                    <!-- По центру внизу: Издатель/Страна и Жанр -->
                    <div class="mid-col-bottom">
                        ${pubCountry ? `<span>${pubCountry}</span>` : ''}
                        ${genre ? `<span class="genre-badge">${genre}</span>` : ''}
                    </div>

                    <!-- Справа внизу: Время и Дата выхода -->
                    <div class="right-col-bottom">
                        ${timeStr ? `<div class="play-time">${timeStr}</div>` : ''}
                        ${releaseDate ? `<div class="release-date">${releaseDate}</div>` : ''}
                    </div>
                </div>
            `;

            container.innerHTML += cardHtml;
        });
    }

    // Загрузка CSV
    fetch(CSV_URL)
        .then(response => response.text())
        .then(csvText => {
            const data = parseCSV(csvText);
            renderCards(data);
        })
        .catch(err => {
            console.error('Ошибка загрузки CSV:', err);
            document.getElementById('cards-container').innerHTML = `
                <div class="loading" style="color: #ef4444;">
                    Ошибка при загрузке данных таблицы.
                </div>`;
        });
</script>

</body>
</html>
