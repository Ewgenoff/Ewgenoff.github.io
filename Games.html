<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки игр</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.9);
            --card-border: #8e8e93;
            --text-primary: #ffffff;
            --text-secondary: #98989d;
            --text-muted: #636366;
            
            --status-passed: #34c759;
            --status-passed-bg: rgba(52, 199, 89, 0.22);
            --status-playing: #ffcc00;
            --status-playing-bg: rgba(255, 204, 0, 0.22);
            --status-not-played: #8e8e93;
            --status-not-played-bg: rgba(142, 142, 147, 0.22);
            
            --badge-bg: #2c2c2e;
            --badge-text: #d1d1d6;
            --accent-blue: #0a84ff;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-top: 140px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 0 10px;
            flex: 1;
        }

        /* АВТОСКРЫВАЮЩАЯСЯ ШАПКА */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 16px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-content {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-hidden {
            transform: translateY(-100%);
        }

        /* Кнопки-счетчики */
        .counters-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .counter-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 0;
        }

        .counter-btn.active {
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        .counter-btn span {
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--text-primary);
        }

        .counter-btn.passed { border-color: rgba(52, 199, 89, 0.4); }
        .counter-btn.passed span { color: var(--status-passed); }

        .counter-btn.playing { border-color: rgba(255, 204, 0, 0.5); }
        .counter-btn.playing span { color: var(--status-playing); }

        .counter-btn.not-played { border-color: rgba(142, 142, 147, 0.4); }
        .counter-btn.not-played span { color: var(--status-not-played); }

        /* Поиск, Сброс и Сортировка */
        .controls-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .search-wrapper .search-icon {
            position: absolute;
            left: 10px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0.7;
        }

        .search-input {
            width: 100%;
            background: var(--badge-bg);
            border: none;
            border-radius: 10px;
            padding: 8px 70px 8px 30px;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        .clear-search-btn {
            position: absolute;
            right: 42px;
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 14px;
            cursor: pointer;
            display: none;
            padding: 2px;
            line-height: 1;
        }

        .clear-search-btn.visible {
            display: block;
        }

        .search-count {
            position: absolute;
            right: 10px;
            font-size: 12px;
            color: #8e8e93;
            pointer-events: none;
            font-weight: 600;
        }

        /* Узкая кнопка сброса (✕) */
        .reset-btn {
            background: #3a3a3c;
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .sort-btn {
            background: #3a3a3c;
            color: var(--text-primary);
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .reset-btn.active {
            background: #3a3a3c;
            color: var(--text-primary);
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .card-flip-container {
            width: 100%;
            height: auto;
            min-height: 132px;
            perspective: 1000px;
        }

        .card-flipper {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-flip-container.flipped .card-flipper {
            transform: rotateX(180deg);
        }

        .game-card, .game-card-back {
            position: relative;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .game-card-back {
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            transform: rotateX(180deg);
            border: 1.5px solid var(--card-border);
            cursor: pointer;
        }

        .card-back-cover {
            width: 80px;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--badge-bg);
            cursor: pointer;
        }

        .card-back-desc {
            flex: 1;
            height: 100%;
            font-size: 11.5px;
            line-height: 1.35;
            color: var(--text-secondary);
            overflow-y: auto;
            word-break: break-word;
            padding-right: 4px;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        /* ЛИЦЕВАЯ КАРТОЧКА */
        .game-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--card-border) !important;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            align-items: stretch;
            cursor: pointer;
            user-select: none;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            width: 54px;
        }

        .single-score-text {
            font-size: 25px;
            font-weight: 800;
            line-height: 1;
            text-align: center;
            padding-top: 2px;
        }

        .voice-under-score {
            font-size: 16px;
            margin-top: 4px;
            text-align: center;
        }

        .game-logo-container {
            width: 54px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: auto;
        }

        .game-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        .mid-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            gap: 2px;
        }

        .titles-block {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .title-en {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            user-select: none;
            cursor: pointer;
            text-decoration: none;
        }

        .title-divider {
            height: 1px;
            background-color: #3a3a3c;
            margin: 4px 0;
            width: 100%;
        }

        .dev-country-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dev-text, .country-text {
            font-size: 12px;
            color: #B5B7BA;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.15;
        }

        .mid-col-bottom {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .ios-pill, .right-pill {
            font-size: 10.5px;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: 6px;
            line-height: 1.15;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-sizing: border-box;
        }

        .genre-pill {
            background-color: rgba(40, 130, 240, 0.15) !important;
            color: #4EA3FF !important;
            white-space: normal;
            word-break: break-word;
            max-height: 32px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-align: left;
            line-height: 1.1;
            padding: 4px 6px;
            cursor: pointer;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .right-pill {
            width: max-content;
            max-width: 130px;
            text-align: right;
            white-space: nowrap;
        }

        .status-passed, .status-playing, .status-not-played {
            font-size: 12px;
        }

        .status-passed { color: var(--status-passed); background: var(--status-passed-bg); }
        .status-playing { color: var(--status-playing); background: var(--status-playing-bg); }
        .status-not-played { color: var(--status-not-played) !important; background: var(--status-not-played-bg) !important; }

        .time-no-pill {
            color: #B5B7BA;
            font-size: 12px;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
        }

        .time-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: right;
            display: block;
        }

        .date-text {
            font-size: 12px;
            color: #B5B7BA;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 12px;
        }

        /* FAB */
        .fab-search {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--accent-blue);
            border: none;
            border-radius: 50%;
            color: white;
            box-shadow: 0 4px 12px var(--shadow-color);
            cursor: pointer;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .fab-search.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .fab-search svg { width: 24px; height: 24px; }

        /* Action Sheet & Modals */
        .ios-action-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 -4px 20px var(--shadow-color);
            z-index: 300;
            transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 80vh;
        }

        .ios-action-sheet.active { bottom: 20px; }

        .sheet-title {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .sheet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .sheet-btn {
            background: var(--badge-bg);
            border: none;
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .sheet-btn:active { opacity: 0.7; }
        .sheet-btn-cancel { background: rgba(255, 59, 48, 0.12); color: #ff3b30; margin-top: 4px; }

        .segment-control {
            display: flex;
            background: var(--badge-bg);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .segment-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(10, 132, 255, 0.3);
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 4px;
        }

        .filter-item-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--badge-bg);
            border-radius: 8px;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
        }

        .filter-item-btn span { color: var(--text-secondary); font-weight: 600; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            touch-action: none;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .logo-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }

        .logo-modal-overlay.active { opacity: 1; pointer-events: auto; }

        .logo-modal-img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
            user-select: none;
            cursor: pointer;
        }

        @media (max-width: 360px) {
            .reset-btn, .sort-btn { padding: 0 10px; font-size: 12px; }
            .search-input { font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- ШАПКА -->
<header class="sticky-header" id="header">
    <div class="header-content">
        <div class="counters-bar">
            <div class="counter-btn passed" id="btn-count-passed" onclick="filterByStatus('passed')">Прошел <span id="count-passed">0</span></div>
            <div class="counter-btn playing" id="btn-count-playing" onclick="filterByStatus('playing')">Не закончил <span id="count-playing">0</span></div>
            <div class="counter-btn not-played" id="btn-count-not-played" onclick="filterByStatus('not-played')">В планах <span id="count-not-played">0</span></div>
        </div>
        <div class="controls-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <!-- Текст Поиск... вместо Название игры... -->
                <input type="text" id="search-input" class="search-input" placeholder="Поиск...">
                <button class="clear-search-btn" id="clear-search-btn" onclick="clearSearch()">✖</button>
                <span class="search-count" id="search-count">0</span>
            </div>
            <!-- Узкая кнопка ✕ вместо Сброс -->
            <button class="reset-btn" id="reset-btn" onclick="resetAllFilters()" title="Сбросить все фильтры">✕</button>
            <button class="sort-btn" id="open-sort-btn">Сортировка</button>
        </div>
    </div>
</header>

<div class="container">
    <div id="cards-container" class="cards-list">
        <div class="loading">Загрузка данных...</div>
    </div>
</div>

<footer>
    <div>Общее кол-во записей: <strong id="total-count">0</strong></div>
    <div>Версия 1.2 (by Ewgenoff 11.08.2026)</div>
</footer>

<!-- ПЛАВАЮЩАЯ КНОПКА ПОИСКА -->
<button id="fab-search" class="fab-search" aria-label="Поиск">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
</button>

<div class="logo-modal-overlay" id="logo-modal-overlay" onclick="closeLogoModalWithPrevent(event)">
    <img id="logo-modal-img" class="logo-modal-img" src="" alt="Фото/Логотип игры" onclick="closeLogoModalWithPrevent(event)">
</div>

<div class="modal-overlay" id="sort-overlay"></div>
<div class="ios-action-sheet" id="sort-sheet">
    <div class="sheet-title">Сортировка игр</div>
    <div class="sheet-grid">
        <button class="sheet-btn" data-sort="title">А-Я</button>
        <button class="sheet-btn" data-sort="year">Дата релиза (PC)</button>
        <button class="sheet-btn" data-sort="score">Оценка</button>
        <button class="sheet-btn" data-sort="developer">Разработчик</button>
        <button class="sheet-btn" data-sort="country">Страна</button>
        <button class="sheet-btn" data-sort="voice">Озвучка</button>
        <button class="sheet-btn" data-sort="time">Время прохождения</button>
    </div>
    <button class="sheet-btn sheet-btn-cancel" id="close-sort-btn">Отмена</button>
</div>

<div class="ios-action-sheet" id="combined-filter-sheet">
    <div class="segment-control">
        <button class="segment-btn active" id="seg-genre" onclick="switchFilterTab('genre')">Жанр</button>
        <button class="segment-btn" id="seg-dev" onclick="switchFilterTab('dev')">Разработчик</button>
        <button class="segment-btn" id="seg-country" onclick="switchFilterTab('country')">Страна</button>
    </div>
    <div class="filter-list" id="filter-list-container"></div>
    <button class="sheet-btn sheet-btn-cancel" onclick="closeCombinedFilterSheet()">Отмена</button>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAaoLfMXIHoBoXTb16tXL_yabaMQThgsWGGrziE5InfpyEf3MIPkVkHD58xCapuR6IPeIRp6lnqLCl/pub?gid=0&single=true&output=csv';

    let gamesData = [];
    let filteredGamesData = [];

    let currentFilterText = '';
    let selectedStatusFilter = null;
    let selectedDeveloperFilter = null;
    let selectedCountryFilter = null;
    let selectedGenreFilter = null;
    let currentFilterTab = 'genre';
    let isSorted = false;

    // Полный словарь флагов для всех стран
    const countryFlags = {
        'США': '🇺🇸', 'USA': '🇺🇸',
        'Россия': '🇷🇺',
        'Япония': '🇯🇵',
        'Великобритания': '🇬🇧', 'Англия': '🇬🇧',
        'Франция': '🇫🇷',
        'Германия': '🇩🇪',
        'Канада': '🇨🇦',
        'Польша': '🇵🇱',
        'Швеция': '🇸🇪',
        'Китай': '🇨🇳',
        'Украина': '🇺🇦',
        'Финляндия': '🇫🇮',
        'Испания': '🇪🇸',
        'Италия': '🇮🇹',
        'Австралия': '🇦🇺',
        'Бельгия': '🇧🇪',
        'Дания': '🇩🇰',
        'Кипр': '🇨🇾',
        'Нидерланды': '🇳🇱',
        'Новая Зеландия': '🇳🇿',
        'Сингапур': '🇸🇬',
        'Чехия': '🇨🇿',
        'Южная Корея': '🇰🇷'
    };

    // Добавление флагов ТОЛЬКО для фильтров (включая разделение через "/")
    function getCountryWithFlags(countryStr) {
        if (!countryStr) return '';
        return countryStr.split('/').map(part => {
            const trimmed = part.trim();
            const flag = countryFlags[trimmed] || '';
            return flag ? `${flag} ${trimmed}` : trimmed;
        }).join(' / ');
    }

    function getScoreColor(scoreNum) {
        if (scoreNum >= 90) return '#34c759';
        if (scoreNum >= 80) return '#30b0c7';
        if (scoreNum >= 70) return '#ffcc00';
        if (scoreNum >= 60) return '#ff9500';
        return '#ff3b30';
    }

    function parseCSV(text) {
        let lines = [];
        let row = [];
        let inQuotes = false;
        let currentToken = '';

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i + 1];

            if (c === '"') {
                if (inQuotes && nextC === '"') {
                    currentToken += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                row.push(currentToken.trim());
                currentToken = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') {
                    i++;
                }
                row.push(currentToken.trim());
                if (row.length > 1 || row[0] !== '') {
                    lines.push(row);
                }
                row = [];
                currentToken = '';
            } else {
                currentToken += c;
            }
        }
        if (currentToken !== '' || row.length > 0) {
            row.push(currentToken.trim());
            lines.push(row);
        }
        return lines;
    }

    function formatHours(val) {
        if (!val) return '0';
        return val.toString().replace(/[^0-9]/g, '') || val;
    }

    function getGameStatus(statusNorm) {
        if (!statusNorm) return 'not-played';
        if (statusNorm.includes('не играл') || statusNorm.includes('неиграл')) return 'not-played';
        if (statusNorm.includes('прошел') || statusNorm.includes('пройдено') || statusNorm.includes('готово')) return 'passed';
        if (statusNorm.includes('играл') || statusNorm.includes('в процессе') || statusNorm.includes('играю')) return 'playing';
        return 'not-played';
    }

    function updateCounters(data) {
        let passed = 0, playing = 0, notPlayed = 0;
        data.forEach(item => {
            const status = getGameStatus(item.statusNorm);
            if (status === 'passed') passed++;
            else if (status === 'playing') playing++;
            else notPlayed++;
        });

        document.getElementById('count-passed').textContent = passed;
        document.getElementById('count-playing').textContent = playing;
        document.getElementById('count-not-played').textContent = notPlayed;
        document.getElementById('total-count').textContent = data.length;
    }

    function checkResetButtonState() {
        const hasSpecificFilter = selectedDeveloperFilter || selectedCountryFilter || selectedGenreFilter;
        const resetBtn = document.getElementById('reset-btn');
        if (hasSpecificFilter) {
            resetBtn.classList.add('active');
        } else {
            resetBtn.classList.remove('active');
        }
    }

    function filterByStatus(type) {
        if (selectedStatusFilter === type) {
            selectedStatusFilter = null;
        } else {
            selectedStatusFilter = type;
        }

        document.querySelectorAll('.counter-btn').forEach(btn => btn.classList.remove('active'));
        if (selectedStatusFilter) {
            document.getElementById(`btn-count-${selectedStatusFilter}`).classList.add('active');
        }

        renderCards(gamesData);
    }

    function resetAllFilters() {
        currentFilterText = '';
        selectedStatusFilter = null;
        selectedDeveloperFilter = null;
        selectedCountryFilter = null;
        selectedGenreFilter = null;
        isSorted = false;
        
        document.getElementById('search-input').value = '';
        document.getElementById('clear-search-btn').classList.remove('visible');
        document.querySelectorAll('.counter-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('reset-btn').classList.remove('active');
        
        renderCards(gamesData);
    }

    function openWikipedia(wikiUrl) {
        if (wikiUrl) {
            window.open(wikiUrl, '_blank');
        } else {
            alert('Ссылка на Википедию отсутствует.');
        }
    }

    function renderCards(data) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';
        checkResetButtonState();

        filteredGamesData = data.filter(item => {
            if (currentFilterText) {
                const term = currentFilterText.toLowerCase();
                const matchSearch = item.titleEn.toLowerCase().includes(term) ||
                                   item.titleRu.toLowerCase().includes(term) ||
                                   item.genre.toLowerCase().includes(term) ||
                                   item.developer.toLowerCase().includes(term);
                if (!matchSearch) return false;
            }

            if (selectedStatusFilter) {
                if (getGameStatus(item.statusNorm) !== selectedStatusFilter) return false;
            }

            if (selectedDeveloperFilter && item.developer !== selectedDeveloperFilter) return false;
            if (selectedCountryFilter && item.country !== selectedCountryFilter) return false;

            if (selectedGenreFilter) {
                const genres = item.genre ? item.genre.split(',').map(g => g.trim()) : [];
                if (!genres.includes(selectedGenreFilter)) return false;
            }

            return true;
        });

        document.getElementById('search-count').textContent = filteredGamesData.length;

        if (filteredGamesData.length === 0) {
            container.innerHTML = `<div class="loading">Ничего не найдено</div>`;
            return;
        }

        filteredGamesData.forEach((item, index) => {
            const status = getGameStatus(item.statusNorm);
            let statusClass = `status-${status}`;

            let scoreColor = getScoreColor(item.scoreNum);
            let flagEmoji = item.voiceover.includes('есть') ? '🇷🇺' : '🇺🇸';

            let timeStr = '';
            if (item.timeMain || item.timeFull) {
                timeStr = `🕐 ${formatHours(item.timeMain)}-${formatHours(item.timeFull)}ч`;
            }

            // В карточках используем Чистый текст страны (БЕЗ флагов)
            const rawCountry = item.country || '';
            const photoSrc = item.logo || item.image || '';
            const backCoverSrc = item.image || item.logo || '';

            const flipContainer = document.createElement('div');
            flipContainer.className = 'card-flip-container';

            const flipper = document.createElement('div');
            flipper.className = 'card-flipper';

            const cardBack = document.createElement('div');
            cardBack.className = 'game-card-back';
            cardBack.innerHTML = `
                <img src="${backCoverSrc}" alt="Обложка" class="card-back-cover" onerror="this.style.opacity='0'" onclick="event.stopPropagation(); openLogoModal('${backCoverSrc}')">
                <div class="card-back-desc">${item.description || 'Описание отсутствует. (Нажмите, чтобы вернуться)'}</div>
            `;

            cardBack.addEventListener('click', (e) => {
                if (e.target.classList.contains('card-back-cover')) return;
                flipContainer.classList.remove('flipped');
            });

            const card = document.createElement('div');
            card.className = `game-card`;

            card.innerHTML = `
                <div class="left-col">
                    <div class="single-score-text" style="color: ${scoreColor};">${item.scoreText}</div>
                    <div class="voice-under-score">${flagEmoji}</div>
                    <div class="game-logo-container">
                        ${photoSrc ? `<img src="${photoSrc}" alt="Logo" class="game-logo" loading="lazy" onclick="event.stopPropagation(); openLogoModal('${photoSrc}')">` : ''}
                    </div>
                </div>

                <div class="mid-col">
                    <div class="titles-block">
                        <div class="title-en">${item.titleEn}</div>
                        <div class="title-divider"></div>
                        <div class="dev-country-block">
                            ${item.developer ? `<div class="dev-text">${item.developer}</div>` : ''}
                            <!-- Чистый текст страны без флага в карточках -->
                            ${rawCountry ? `<div class="country-text">${rawCountry}</div>` : ''}
                        </div>
                    </div>
                    <div class="mid-col-bottom">
                        ${item.genre ? `<span class="ios-pill genre-pill" onclick="event.stopPropagation(); openCombinedFilterSheet('genre')">${item.genre}</span>` : ''}
                    </div>
                </div>

                <div class="right-col">
                    <div class="right-pill ${statusClass}">${item.status || 'В планах'}</div>
                    
                    ${timeStr ? `
                        <div style="display: flex; flex-direction: column; align-items: flex-end;">
                            <span class="time-label">время игры:</span>
                            <div class="time-no-pill">${timeStr}</div>
                        </div>
                    ` : ''}
                    
                    <div style="display: flex; flex-direction: column; align-items: flex-end;">
                        ${item.releaseDate ? `<div class="date-text">${item.releaseDate}</div>` : ''}
                    </div>
                </div>
            `;

            flipper.appendChild(card);
            flipper.appendChild(cardBack);
            flipContainer.appendChild(flipper);
            container.appendChild(flipContainer);

            card.addEventListener('click', (e) => {
                if (e.target.closest('.genre-pill, .game-logo')) return;
                flipContainer.classList.add('flipped');
            });

            let lastTapTime = 0;
            card.addEventListener('click', (e) => {
                if (e.target.closest('.genre-pill, .game-logo')) return;
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 300 && tapLength > 0) {
                    e.stopPropagation();
                    openWikipedia(item.wiki);
                }
                lastTapTime = currentTime;
            });
        });
    }

    // ЗАГРУЗКА ДАННЫХ
    fetch(CSV_URL)
        .then(res => res.text())
        .then(csvText => {
            const parsed = parseCSV(csvText);
            const rows = parsed.slice(1);

            gamesData = rows.map((row, index) => {
                if (!row || row.length < 2 || !row[1]) return null;
                return {
                    id: 'game_' + index,
                    titleEn: row[1] || 'Без названия',
                    titleRu: row[2] || '',
                    status: (row[3] || '').trim(),
                    statusNorm: (row[3] || '').trim().toLowerCase(),
                    releaseDate: row[4] || '',
                    scoreNum: parseFloat(row[5]) || 0,
                    scoreText: row[5] || '—',
                    developer: row[6] || '',
                    country: row[7] || '',
                    voiceover: (row[8] || '').trim().toLowerCase(),
                    genre: row[9] || '',
                    timeMain: row[11] || '',
                    timeFull: row[12] || '',
                    link: row[14] || '',
                    description: row[15] || '',
                    image: row[18] || '', 
                    logo: row[19] || '',  
                    wiki: row[20] || ''   
                };
            }).filter(Boolean);

            updateCounters(gamesData);
            renderCards(gamesData);
        })
        .catch(err => {
            console.error(err);
            document.getElementById('cards-container').innerHTML = `
                <div class="loading" style="color: #ff3b30;">Ошибка загрузки данных Таблицы</div>`;
        });

    // ПОИСК
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search-btn');

    searchInput.addEventListener('input', (e) => {
        currentFilterText = e.target.value;
        if (currentFilterText.length > 0) {
            clearBtn.classList.add('visible');
        } else {
            clearBtn.classList.remove('visible');
        }
        renderCards(gamesData);
    });

    function clearSearch() {
        searchInput.value = '';
        currentFilterText = '';
        clearBtn.classList.remove('visible');
        renderCards(gamesData);
    }

    // СКРОЛЛ И FAB
    let lastScrollY = window.scrollY;
    const header = document.getElementById('header');
    const fabSearch = document.getElementById('fab-search');
    let scrollTimeout;

    window.addEventListener('scroll', () => {
        document.querySelectorAll('.card-flip-container.flipped').forEach(card => {
            card.classList.remove('flipped');
        });

        if (window.scrollY > lastScrollY && window.scrollY > 80) {
            header.classList.add('header-hidden');
        } else {
            header.classList.remove('header-hidden');
        }
        lastScrollY = window.scrollY;

        fabSearch.classList.add('active');
        
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            fabSearch.classList.remove('active');
        }, 2000);
    });

    fabSearch.addEventListener('click', () => {
        header.classList.remove('header-hidden');
        searchInput.focus();
    });

    // ПРОСМОТР ФОТО
    const logoOverlay = document.getElementById('logo-modal-overlay');
    const logoImg = document.getElementById('logo-modal-img');

    function openLogoModal(src) {
        if (!src) return;
        logoImg.src = src;
        logoOverlay.classList.add('active');
    }

    function closeLogoModalWithPrevent(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        logoOverlay.classList.remove('active');
    }

    // СОРТИРОВКА
    const sortOverlay = document.getElementById('sort-overlay');
    const sortSheet = document.getElementById('sort-sheet');
    const openSortBtn = document.getElementById('open-sort-btn');
    const closeSortBtn = document.getElementById('close-sort-btn');

    openSortBtn.onclick = () => {
        sortOverlay.classList.add('active');
        sortSheet.classList.add('active');
    };

    function closeSortSheet() {
        sortOverlay.classList.remove('active');
        sortSheet.classList.remove('active');
    }

    closeSortBtn.onclick = closeSortSheet;
    sortOverlay.onclick = () => {
        closeSortSheet();
        closeCombinedFilterSheet();
    };

    document.querySelectorAll('.sheet-btn[data-sort]').forEach(btn => {
        btn.onclick = () => {
            const type = btn.getAttribute('data-sort');
            isSorted = true;
            
            const dateToNum = (dateStr) => {
                if (!dateStr) return 0;
                const parts = dateStr.toString().split(/[.,\/]/).map(p => p.trim());
                if (parts.length === 3) {
                    const day = parts[0].padStart(2, '0');
                    const month = parts[1].padStart(2, '0');
                    const year = parts[2];
                    return parseInt(`${year}${month}${day}`, 10);
                }
                return 0;
            };

            gamesData.sort((a, b) => {
                switch(type) {
                    case 'title': return a.titleEn.localeCompare(b.titleEn);
                    case 'year': return dateToNum(b.releaseDate) - dateToNum(a.releaseDate);
                    case 'score': return b.scoreNum - a.scoreNum;
                    case 'developer': return a.developer.localeCompare(b.developer);
                    case 'country': return a.country.localeCompare(b.country);
                    case 'voice': return a.voiceover.localeCompare(b.voiceover);
                    case 'time': return (parseInt(b.timeMain)||0) - (parseInt(a.timeMain)||0);
                    default: return 0;
                }
            });

            renderCards(gamesData);
            closeSortSheet();
        };
    });

    // ФИЛЬТРЫ
    const combinedFilterSheet = document.getElementById('combined-filter-sheet');

    function openCombinedFilterSheet(tab = 'genre') {
        sortOverlay.classList.add('active');
        combinedFilterSheet.classList.add('active');
        switchFilterTab(tab);
    }

    function closeCombinedFilterSheet() {
        combinedFilterSheet.classList.remove('active');
        if (!sortSheet.classList.contains('active')) {
            sortOverlay.classList.remove('active');
        }
    }

    function switchFilterTab(tab) {
        currentFilterTab = tab;
        document.getElementById('seg-genre').classList.toggle('active', tab === 'genre');
        document.getElementById('seg-dev').classList.toggle('active', tab === 'dev');
        document.getElementById('seg-country').classList.toggle('active', tab === 'country');
        renderFilterList();
    }

    function renderFilterList() {
        const listContainer = document.getElementById('filter-list-container');
        listContainer.innerHTML = '';

        const counts = {};

        gamesData.forEach(item => {
            if (currentFilterTab === 'genre' && item.genre) {
                item.genre.split(',').forEach(g => {
                    const trimmed = g.trim();
                    if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
                });
            } else if (currentFilterTab === 'dev' && item.developer) {
                counts[item.developer] = (counts[item.developer] || 0) + 1;
            } else if (currentFilterTab === 'country' && item.country) {
                counts[item.country] = (counts[item.country] || 0) + 1;
            }
        });

        const genreSet = new Set(), devSet = new Set(), countrySet = new Set();
        gamesData.forEach(item => {
            if (item.genre) item.genre.split(',').forEach(g => g.trim() && genreSet.add(g.trim()));
            if (item.developer) devSet.add(item.developer);
            if (item.country) countrySet.add(item.country);
        });

        document.getElementById('seg-genre').textContent = `Жанр (${genreSet.size})`;
        document.getElementById('seg-dev').textContent = `Разраб. (${devSet.size})`;
        document.getElementById('seg-country').textContent = `Страна (${countrySet.size})`;

        const sortedKeys = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ru'));

        sortedKeys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'filter-item-btn';
            
            // В окне-фильтре выводятся флаги перед странами
            const labelText = currentFilterTab === 'country' ? getCountryWithFlags(key) : key;
            btn.innerHTML = `${labelText} <span>(${counts[key]})</span>`;
            
            btn.onclick = () => {
                if (currentFilterTab === 'genre') {
                    selectedGenreFilter = key;
                } else if (currentFilterTab === 'dev') {
                    selectedDeveloperFilter = key;
                    selectedCountryFilter = null;
                } else if (currentFilterTab === 'country') {
                    selectedCountryFilter = key;
                    selectedDeveloperFilter = null;
                }
                renderCards(gamesData);
                closeCombinedFilterSheet();
            };
            listContainer.appendChild(btn);
        });
    }
</script>

</body>
